<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Browser Toys — ブラウザで動くバニラJSアプリ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2307090d'/%3E%3Cpath d='M18 72 L50 18 L82 72 Z' fill='none' stroke='%233de0c5' stroke-width='6'/%3E%3C/svg%3E" />
<meta name="description" content="ビルド不要・依存ゼロのバニラJavaScriptブラウザアプリ集。ツール・ビジュアル・シミュレーション・音をテーマ切替対応ギャラリーで探せます。" />
<script>
  (function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="theme.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 28px}

  .topbar{
    display:flex;align-items:center;justify-content:flex-end;
    padding:18px 0 0;
  }

  header.hero{padding:28px 0 18px}
  h1.title{
    font-family:var(--font-display);
    font-size:clamp(42px,8vw,72px);
    font-weight:800;
    letter-spacing:-.03em;
    line-height:1.02;
    color:var(--title-color);
    text-shadow:var(--title-glow);
  }
  .lead{
    color:var(--muted);
    font-size:clamp(14px,2.2vw,17px);
    margin-top:14px;
    max-width:34em;
  }

  .controls{
    position:sticky;top:0;z-index:50;
    background:var(--controls-bg);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:12px 0;
    margin-top:20px;
  }
  .controls-inner{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .search{position:relative;flex:1;min-width:200px;max-width:360px}
  .search input{
    width:100%;
    background:transparent;
    border:0;
    border-bottom:1px solid var(--border2);
    border-radius:0;
    color:var(--text);
    font-family:var(--font-body);
    font-size:14px;
    padding:10px 28px 10px 0;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .search input::placeholder{color:var(--muted2)}
  .search input:focus{
    border-bottom-color:var(--accent);
    box-shadow:0 1px 0 0 var(--accent);
  }
  .search .clr{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;
    padding:4px;display:none;
  }
  .search .clr:hover{color:var(--text)}
  .count{color:var(--muted2);font-size:13px;margin-left:auto;white-space:nowrap}
  .count b{color:var(--text);font-weight:600}

  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:14px}
  .tab{
    position:relative;background:none;border:0;color:var(--muted);
    font-family:var(--font-body);
    font-size:13px;font-weight:600;letter-spacing:.02em;
    padding:8px 10px;cursor:pointer;transition:color .15s;
  }
  .tab:hover{color:var(--text)}
  .tab::after{
    content:"";position:absolute;left:10px;right:10px;bottom:2px;height:1px;
    background:transparent;transition:background .15s, box-shadow .15s;
  }
  .tab.active{color:var(--text)}
  .tab.active::after{
    background:var(--accent);
    box-shadow:0 0 8px color-mix(in srgb, var(--accent) 50%, transparent);
  }
  [data-theme="lab"] .tab.active::after{box-shadow:none}

  section.block{padding:36px 0 8px}
  .block-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
  .block-head h2{
    font-family:var(--font-display);
    font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted2);
  }
  .block-sub{color:var(--muted2);font-size:13px}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:18px 16px;
    padding-bottom:8px;
  }
  .card{
    position:relative;
    display:flex;flex-direction:column;
    background:transparent;
    border:0;
    border-radius:0;
    padding:0;
    min-height:0;
    transition:opacity .16s ease, transform .16s ease;
  }
  .card:hover{transform:translateY(-2px)}
  .card:hover .card-preview{border-color:color-mix(in srgb, var(--ac, var(--accent)) 55%, var(--border))}
  .card-preview{
    aspect-ratio:16/10;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:linear-gradient(160deg, var(--preview-from), var(--preview-to));
    position:relative;
    overflow:hidden;
    transition:border-color .16s;
  }
  .card-preview canvas{
    position:absolute;inset:0;width:100%;height:100%;display:block;
  }
  .card-mark{
    position:absolute;left:12px;bottom:10px;z-index:2;
    font-family:var(--font-display);
    font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.82);
    text-shadow:0 1px 8px rgba(0,0,0,.55);
    pointer-events:none;
  }
  [data-theme="lab"] .card-mark{
    color:rgba(20,32,51,.78);
    text-shadow:0 1px 0 rgba(255,255,255,.55);
  }
  .card-title{
    font-family:var(--font-display);
    font-size:17px;font-weight:700;letter-spacing:-.01em;
    margin-top:12px;color:var(--text);
  }
  .card-desc{
    color:var(--muted);font-size:13px;line-height:1.5;margin-top:5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-meta{
    margin-top:8px;font-size:11.5px;color:var(--muted2);letter-spacing:.04em;
  }

  .empty{text-align:left;color:var(--muted);padding:48px 0}
  footer{
    border-top:1px solid var(--border);
    margin-top:56px;padding:28px 0 48px;
    color:var(--muted2);font-size:13px;
  }
  footer a{color:var(--accent);font-weight:600}
  footer a:hover{text-decoration:underline}
  footer .fnote{margin-top:6px;font-size:12.5px}
  footer code{font-family:var(--font-mono);font-size:12px}

  @media (max-width:640px){
    .wrap{padding:0 18px}
    header.hero{padding:18px 0 10px}
    .grid{grid-template-columns:1fr 1fr;gap:14px 12px}
    .count{order:3;width:100%;margin-left:0}
    .search{max-width:none}
  }
  @media (max-width:420px){
    .grid{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;scroll-behavior:auto}
    .card:hover{transform:none}
  }
</style>
</head>
<body class="bt-themed">
  <div class="wrap">
    <div class="topbar">
      <div class="theme-switch" role="group" aria-label="テーマ切替">
        <button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button>
        <button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button>
      </div>
    </div>
  </div>

  <header class="hero">
    <div class="wrap">
      <h1 class="title">Browser Toys</h1>
      <p class="lead">ビルド不要・依存ゼロのバニラJSアプリ。ツールと遊びを、そのままブラウザで。</p>
    </div>
  </header>

  <div class="controls">
    <div class="wrap">
      <div class="controls-inner">
        <div class="search">
          <input type="text" id="search" placeholder="検索…" autocomplete="off" spellcheck="false" />
          <button class="clr" id="clear" title="クリア" aria-label="検索をクリア">✕</button>
        </div>
        <div class="count"><b id="count">0</b> / <span id="total">0</span></div>
      </div>
      <nav class="tabs" id="tabs" role="tablist"></nav>
    </div>
  </div>

  <main class="wrap">
    <section class="block">
      <div class="block-head">
        <h2 id="all-title">Apps</h2>
        <div class="block-sub" id="all-sub"></div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" style="display:none">該当するアプリが見つかりませんでした</div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <div>Browser Toys — <a href="https://github.com/kantafukui/browser-toys" target="_blank" rel="noopener">github.com/kantafukui/browser-toys</a></div>
      <div class="fnote">各アプリは <code>apps/&lt;name&gt;/index.html</code> にあります。テーマは Cyber / Lab を切替できます。</div>
    </div>
  </footer>

<script src="theme.js"></script>
<script>
/* === App catalog data (embedded, no external deps) === */
const CATS = {
  tools: { label: 'Tools', ja: 'ツール' },
  visualart: { label: 'Art', ja: 'ビジュアル' },
  science: { label: 'Science', ja: '科学' },
  audio: { label: 'Sound', ja: '音' }
};
const APPS = [{"n":"artlab","t":"ArtLab","d":"ジェネラティブアート・ランチャー。Cosmos・Matrix・Fireworks・Spirograph・Starfield・Weather・Glitchを1画面で切り替え、全画面表示できるハブ。","c":"visualart","i":"🎨","a":"#a78bfa","s":5,"f":1,"g":["ランチャー","アート","ギャラリー","星空","花火","グリッチ","cosmos","matrix","weather","fireworks","spirograph","starfield","glitch"]},{"n":"crypto","t":"Crypto Lab","d":"暗号・ハッシュ・パスワード生成ツール。古典暗号は学習用。SHAハッシュ、安全なパスワード生成、ステガノグラフィー対応。","c":"tools","i":"🔐","a":"#f59e0b","s":4,"f":0,"g":["暗号","ハッシュ","パスワード"]},{"n":"imgresize","t":"画像リサイズ・圧縮","d":"画像リサイズ・圧縮ツール。JPEG/PNG/WebP出力と品質調整に対応。処理はすべてブラウザ内Canvasで完結。","c":"tools","i":"🖼️","a":"#818cf8","s":4,"f":0,"g":["画像","リサイズ","ツール"]},{"n":"contrast-checker","t":"Color Contrast Checker","d":"カラーコントラストチェッカー。前景色・背景色のコントラスト比を計算、WCAG AA/AAA基準の合否判定。アクセシビリティ対応に最適。","c":"tools","i":"🔍","a":"#89b4fa","s":3,"f":0,"g":["アクセシビリティ","カラー","WCAG"]},{"n":"clocktools","t":"ClockTools","d":"時計・タイマー統合アプリ。クロック（デジタル・ワード・2進数）・世界時計・ストップウォッチ・タイマー・ポモドーロ・インターバルの5機能。","c":"tools","i":"⏰","a":"#7c8cff","s":5,"f":1,"g":["時計","タイマー","ツール集"]},{"n":"calctools","t":"CalcTools","d":"計算機統合アプリ。電卓・関数グラフ・単位変換・割り勘・営業日・和暦西暦・BMI・ローン・サイコロの9機能を1画面で。","c":"tools","i":"🧮","a":"#4dd0e1","s":5,"f":1,"g":["計算機","変換","サイコロ","ツール集"]},{"n":"soundlab","t":"SoundLab","d":"音・オーディオ統合ハブ。メトロノーム・チューナー・シンセ・波形ビジュアライザーを1画面で切り替え。","c":"audio","i":"🎵","a":"#ff6b6b","s":5,"f":1,"g":["音楽","オーディオ","ハブ","metronome","tuner","synthy","waveform"]},{"n":"texttools","t":"TextTools","d":"テキスト統合ハブ。文字数カウンター・ダミーテキスト生成・差分ビューア・正規表現ラボを1画面で切り替え。","c":"tools","i":"📝","a":"#fb923c","s":5,"f":1,"g":["テキスト","文字","ハブ","charcount","loremgen","diffview","regex","lorem"]},{"n":"physicslab","t":"PhysicsLab","d":"物理・天体シミュレーション統合ハブ。ライフゲーム・軌道・振り子波・太陽系を1画面で切り替え。","c":"science","i":"🪐","a":"#cba6f7","s":5,"f":1,"g":["物理","シミュレーション","ハブ","life","orbit","pendulum","solar-system","solar"]},{"n":"learnviz","t":"LearnViz","d":"学習・可視化統合ハブ。ソート可視化・確率シミュレーター・フーリエお絵かきを1画面で切り替え。","c":"science","i":"📈","a":"#6366f1","s":5,"f":1,"g":["学習","可視化","ハブ","sortviz","probsim","fourier"]}];

const $ = s => document.querySelector(s);
const catOrder = ['all', 'tools', 'visualart', 'science', 'audio'];
const state = { cat: 'all', q: '' };

function catCount(cat){
  return cat === 'all' ? APPS.length : APPS.filter(a => a.c === cat).length;
}

function buildTabs(){
  const tabs = $('#tabs');
  const frag = document.createDocumentFragment();
  catOrder.forEach(cat => {
    const label = cat === 'all' ? 'All' : CATS[cat].label;
    const el = document.createElement('button');
    el.className = 'tab' + (cat === state.cat ? ' active' : '');
    el.dataset.cat = cat;
    el.setAttribute('role', 'tab');
    el.setAttribute('aria-selected', cat === state.cat ? 'true' : 'false');
    el.textContent = label;
    el.title = cat === 'all' ? `すべて (${catCount(cat)})` : `${CATS[cat].ja} (${catCount(cat)})`;
    el.addEventListener('click', () => { state.cat = cat; render(); syncTabs(); });
    frag.appendChild(el);
  });
  tabs.appendChild(frag);
}
function syncTabs(){
  document.querySelectorAll('.tab').forEach(t => {
    const active = t.dataset.cat === state.cat;
    t.classList.toggle('active', active);
    t.setAttribute('aria-selected', active ? 'true' : 'false');
  });
}

function shortDesc(d){
  const s = String(d || '');
  const cut = s.split(/[。．]/)[0];
  return cut.length > 48 ? cut.slice(0, 48) + '…' : cut;
}

function cardHTML(a){
  const cat = CATS[a.c] ? CATS[a.c].label : a.c;
  return `<a class="card" href="apps/${a.n}/index.html" style="--ac:${a.a}" data-app="${esc(a.n)}">
    <div class="card-preview" aria-hidden="true">
      <canvas data-preview="${esc(a.n)}"></canvas>
      <span class="card-mark">${esc(cat)}</span>
    </div>
    <div class="card-title">${esc(a.t)}</div>
    <div class="card-desc">${esc(shortDesc(a.d))}</div>
    <div class="card-meta">${esc(a.n)}</div>
  </a>`;
}

/* Mini live previews for gallery cards */
function previewTheme(){
  const dark = document.documentElement.getAttribute('data-theme') !== 'lab';
  return {
    dark,
    bg: dark ? '#0a121a' : '#d7e2ee',
    ink: dark ? '#e8eef7' : '#1a2433',
    muted: dark ? 'rgba(232,238,247,.35)' : 'rgba(26,36,51,.28)',
    grid: dark ? 'rgba(61,224,197,.08)' : 'rgba(29,111,216,.12)',
  };
}
function hexAlpha(hex, a){
  const h = String(hex||'#3de0c5').replace('#','');
  const full = h.length===3 ? h.split('').map(c=>c+c).join('') : h;
  const n = parseInt(full, 16);
  if (Number.isNaN(n)) return `rgba(61,224,197,${a})`;
  const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return `rgba(${r},${g},${b},${a})`;
}
function drawPreview(canvas, id, accent){
  const parent = canvas.parentElement;
  const w = Math.max(1, parent.clientWidth);
  const h = Math.max(1, parent.clientHeight);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const T = previewTheme();
  const ac = accent || '#3de0c5';
  const t = (performance.now() / 1000);

  // base
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, T.bg);
  g.addColorStop(1, hexAlpha(ac, T.dark ? 0.28 : 0.18));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // soft grid
  ctx.strokeStyle = T.grid;
  ctx.lineWidth = 1;
  for (let x = 0; x < w; x += 18){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
  for (let y = 0; y < h; y += 18){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }

  ctx.save();
  if (id === 'artlab'){
    for (let i=0;i<48;i++){
      const x = (Math.sin(i*1.7+t*.3)*.5+.5)*w;
      const y = (Math.cos(i*1.1+t*.2)*.5+.5)*h;
      ctx.fillStyle = hexAlpha(i%3?ac:'#a78bfa', .35 + (i%5)*.08);
      ctx.beginPath(); ctx.arc(x,y,1.2+(i%4),0,Math.PI*2); ctx.fill();
    }
    ctx.strokeStyle = hexAlpha(ac,.55); ctx.lineWidth=1.2;
    ctx.beginPath();
    for (let x=0;x<=w;x+=4){
      const y = h*.55 + Math.sin(x*.04+t)*12 + Math.sin(x*.01-t*.7)*18;
      x?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();
  } else if (id === 'crypto'){
    ctx.fillStyle = hexAlpha(ac,.15);
    ctx.fillRect(w*.18,h*.22,w*.64,h*.56);
    ctx.strokeStyle = ac; ctx.lineWidth=2;
    ctx.strokeRect(w*.18,h*.22,w*.64,h*.56);
    ctx.font = `600 ${Math.floor(h*.16)}px ui-monospace, monospace`;
    ctx.fillStyle = T.ink;
    ctx.fillText('0xA7', w*.28, h*.52);
    ctx.fillStyle = hexAlpha(ac,.8);
    ctx.fillText('##', w*.58, h*.68);
  } else if (id === 'imgresize'){
    ctx.fillStyle = hexAlpha(ac,.2);
    ctx.fillRect(w*.14,h*.18,w*.42,h*.48);
    ctx.strokeStyle = ac; ctx.lineWidth=1.5;
    ctx.strokeRect(w*.14,h*.18,w*.42,h*.48);
    ctx.fillStyle = hexAlpha(ac,.45);
    ctx.fillRect(w*.42,h*.36,w*.34,h*.36);
    ctx.strokeStyle = T.ink; ctx.setLineDash([4,3]);
    ctx.strokeRect(w*.42,h*.36,w*.34,h*.36);
  } else if (id === 'contrast-checker'){
    ctx.fillStyle = '#111'; ctx.fillRect(w*.12,h*.2,w*.36,h*.58);
    ctx.fillStyle = '#f4f4f4'; ctx.fillRect(w*.48,h*.2,w*.4,h*.58);
    ctx.fillStyle = '#fff'; ctx.font=`700 ${Math.floor(h*.2)}px sans-serif`;
    ctx.fillText('Aa', w*.2, h*.55);
    ctx.fillStyle = '#111'; ctx.fillText('Aa', w*.58, h*.55);
  } else if (id === 'clocktools'){
    const cx=w*.5, cy=h*.5, r=Math.min(w,h)*.32;
    ctx.strokeStyle = ac; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
    const ang = t%(Math.PI*2);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(ang-Math.PI/2)*r*.7, cy+Math.sin(ang-Math.PI/2)*r*.7); ctx.stroke();
    ctx.strokeStyle = T.ink; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(ang*12-Math.PI/2)*r*.45, cy+Math.sin(ang*12-Math.PI/2)*r*.45); ctx.stroke();
  } else if (id === 'calctools'){
    const cols=4, rows=3, pad=w*.12, gap=6;
    const bw=(w-pad*2-gap*(cols-1))/cols, bh=(h-pad*2-gap*(rows-1))/rows;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const x=pad+c*(bw+gap), y=pad+r*(bh+gap);
      ctx.fillStyle = hexAlpha(ac, (r+c)%2? .18:.3);
      ctx.fillRect(x,y,bw,bh);
    }
    ctx.fillStyle = T.ink;
    ctx.font = `700 ${Math.floor(h*.18)}px ui-monospace, monospace`;
    ctx.textAlign='right';
    ctx.fillText('42', w-pad, pad+bh*.7);
    ctx.textAlign='left';
  } else if (id === 'soundlab'){
    ctx.strokeStyle = ac; ctx.lineWidth=2; ctx.beginPath();
    for(let x=0;x<=w;x++){
      const y = h*.5 + Math.sin(x*.08 + t*3)* (h*.18) * Math.sin(x*.02 + t);
      x?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();
    ctx.strokeStyle = hexAlpha(ac,.4); ctx.beginPath();
    for(let x=0;x<=w;x+=3){
      const y = h*.5 + Math.sin(x*.12 - t*2)* (h*.08);
      x?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();
  } else if (id === 'texttools'){
    for(let i=0;i<6;i++){
      const y = h*.22 + i*(h*.1);
      ctx.fillStyle = hexAlpha(ac, i===2? .7 : .25);
      ctx.fillRect(w*.14, y, w*(.45 + (i%3)*.12), 7);
    }
    ctx.strokeStyle = ac; ctx.strokeRect(w*.14, h*.22 + 2*(h*.1)-4, w*.57, 15);
  } else if (id === 'physicslab'){
    const cx=w*.5, cy=h*.52;
    ctx.strokeStyle = hexAlpha(ac,.5); ctx.beginPath();
    ctx.ellipse(cx,cy,w*.34,h*.18,0,0,Math.PI*2); ctx.stroke();
    const ox = cx + Math.cos(t)*w*.34, oy = cy + Math.sin(t)*h*.18;
    ctx.fillStyle = ac; ctx.beginPath(); ctx.arc(ox,oy,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = hexAlpha('#ffcc55',.9); ctx.beginPath(); ctx.arc(cx,cy,7,0,Math.PI*2); ctx.fill();
  } else if (id === 'learnviz'){
    const n=8, gap=5, pad=w*.12;
    const bw=(w-pad*2-gap*(n-1))/n;
    for(let i=0;i<n;i++){
      const hh = h*(.2 + ((Math.sin(t+i)+1)*.25) + (i%3)*.08);
      ctx.fillStyle = hexAlpha(ac, .35 + (i/n)*.4);
      ctx.fillRect(pad+i*(bw+gap), h-pad-hh, bw, hh);
    }
  } else {
    ctx.fillStyle = hexAlpha(ac,.35);
    ctx.beginPath(); ctx.arc(w*.5,h*.5,Math.min(w,h)*.22,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

let previewRaf = 0;
let previewLast = 0;
function paintPreviews(){
  document.querySelectorAll('canvas[data-preview]').forEach(c => {
    const id = c.getAttribute('data-preview');
    const card = c.closest('.card');
    const ac = card ? getComputedStyle(card).getPropertyValue('--ac').trim() : '#3de0c5';
    drawPreview(c, id, ac || '#3de0c5');
  });
}
function startPreviewLoop(){
  cancelAnimationFrame(previewRaf);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce){ paintPreviews(); return; }
  const tick = (now) => {
    if (now - previewLast > 80){ // ~12fps
      previewLast = now;
      paintPreviews();
    }
    previewRaf = requestAnimationFrame(tick);
  };
  previewRaf = requestAnimationFrame(tick);
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function matches(a){
  if (state.cat !== 'all' && a.c !== state.cat) return false;
  if (!state.q) return true;
  const q = state.q;
  const hay = (a.t + ' ' + a.n + ' ' + a.d + ' ' + (a.g||[]).join(' ')).toLowerCase();
  return q.split(/\s+/).every(term => hay.includes(term));
}

function render(){
  const list = APPS.filter(matches);
  $('#grid').innerHTML = list.map(cardHTML).join('');
  $('#empty').style.display = list.length ? 'none' : 'block';
  $('#count').textContent = list.length;

  const allTitle = state.cat === 'all' ? 'Apps' : CATS[state.cat].label;
  $('#all-title').textContent = allTitle;
  $('#all-sub').textContent = state.q
    ? `「${state.q}」 ${list.length} 件`
    : `${list.length} apps`;
  requestAnimationFrame(paintPreviews);
}

function init(){
  $('#total').textContent = APPS.length;
  buildTabs();
  render();
  startPreviewLoop();
  window.addEventListener('resize', () => paintPreviews());
  document.addEventListener('bt:theme', () => paintPreviews());

  const search = $('#search');
  const clr = $('#clear');
  search.addEventListener('input', () => {
    state.q = search.value.trim().toLowerCase();
    clr.style.display = search.value ? 'block' : 'none';
    render();
  });
  clr.addEventListener('click', () => {
    search.value = ''; state.q = ''; clr.style.display = 'none';
    search.focus(); render();
  });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== search){ e.preventDefault(); search.focus(); }
    if (e.key === 'Escape' && document.activeElement === search){ search.value=''; state.q=''; clr.style.display='none'; render(); }
  });
}
init();
</script>
