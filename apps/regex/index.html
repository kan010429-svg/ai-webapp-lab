<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Regex Lab</title><script>(function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../../theme.css" />
<link rel="stylesheet" href="../../app-ui.css" />
<link rel="stylesheet" href="style.css"></head>
<body class="bt-themed bt-app bt-app-fill"><div class="wb-page wb-page-fill regex-workbench"><header class="wb-toolbar"><div class="wb-toolbar-left"><a class="wb-home" href="../../index.html">Apps</a><h1>Regex</h1></div><div class="wb-toolbar-right"><div class="theme-switch" role="group" aria-label="テーマ切替"><button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button><button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button></div><button id="btn-save" class="wb-btn-quiet" type="button">Save</button><button id="btn-saved" class="wb-btn-quiet" type="button">Saved</button><select id="presets" aria-label="Presets"><option value="">Presets</option></select><button id="btn-cheat" class="wb-btn-quiet" type="button">Cheatsheet</button></div></header><main class="main"><section class="input-section"><div class="regex-row" aria-label="Regular expression"><span class="regex-slash">/</span><input type="text" id="regex-input" placeholder="Regular expression" spellcheck="false"><span class="regex-slash">/</span><input type="text" id="flags-input" value="g" placeholder="flags" spellcheck="false" class="flags-input"></div><div id="regex-error" class="regex-error"></div><div id="regex-explain" class="regex-explain"></div><div class="info-bar wb-metrics"><span class="wb-metric"><span class="wb-label">Matches</span><b id="match-count">0 マッチ</b></span><span class="wb-metric"><span class="wb-label">Groups</span><b id="group-count">0 グループ</b></span><span class="wb-metric"><span class="wb-label">Time</span><b id="exec-time">0ms</b></span></div></section><div class="wb-tabs mode-tabs"><button class="mode-tab active" data-mode="test" type="button">Test</button><button class="mode-tab" data-mode="replace" type="button">Replace</button></div><section class="panels"><div id="testMode" class="mode-content"><div class="panel test-panel"><div class="panel-header">Test string</div><div id="test-display" class="test-display"></div><textarea id="test-input" s <script src="../../theme.js"></script></body></html>
