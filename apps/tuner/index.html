<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuner - チューナー</title>
  <script>
  (function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../../theme.css" />
<link rel="stylesheet" href="../../app-ui.css" />
<link rel="stylesheet" href="style.css">
</head>
<body class="bt-themed bt-app bt-canvas-app">
  <div id="app" class="bt-shell bt-shell-narrow">
    <header>
      <div class="bt-top">
        <a class="bt-back" href="../../index.html">← 一覧へ戻る</a>
        <div class="bt-brand">
          <h1>Tuner</h1>
          <p class="subtitle">楽器チューナー</p>
        </div>
        <div class="theme-switch" role="group" aria-label="テーマ切替">
          <button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button>
          <button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button>
        </div>
      </div>
    </header>

    <main>
      <div class="note-display">
        <canvas id="waveform" class="waveform"></canvas>
        <div id="noteCircle" class="note-circle">
          <span id="noteName">-</span>
        </div>
        <div id="frequency" class="frequency">-- Hz</div>
        <div id="cents" class="cents">0¢</div>
      </div>

      <div class="tuning-meter">
        <div class="meter-marks">
          <span>-50</span>
          <span>0</span>
          <span>+50</span>
        </div>
        <div class="meter-bar">
          <div id="meterNeedle" class="meter-needle"></div>
        </div>
      </div>

      <div class="controls">
        <button id="startBtn" class="btn btn-start">🎤 開始</button>
        
        <div class="tuning-select">
          <label for="tuningMode">チューニング</label>
          <select id="tuningMode">
            <option value="chromatic">クロマチック</option>
            <option value="guitar">ギター (E A D G B E)</option>
            <option value="bass">ベース (E A D G)</option>
            <option value="ukulele">ウクレレ (G C E A)</option>
          </select>
        </div>

        <div class="reference-pitch">
          <label for="a4Freq">基準ピッチ (A4): <span id="a4Value">440</span> Hz</label>
          <input type="range" id="a4Freq" min="430" max="450" value="440" step="1">
        </div>

        <div class="auto-tune">
          <label><input type="checkbox" id="autoAlert"> 自動アラート（±5¢以内）</label>
        </div>
      </div>

      <div id="stringGuide" class="string-guide"></div>

      <div class="stats" id="stats">
        <h3>📊 統計</h3>
        <div class="stat-grid">
          <div class="stat-item">
            <span class="stat-label">チューニング回数</span>
            <span class="stat-value" id="tuneCount">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">平均精度</span>
            <span class="stat-value" id="avgAccuracy">-</span>
          </div>
        </div>
      </div>

      <div class="history" id="history">
        <h3>📝 履歴</h3>
        <div id="historyList"></div>
        <button id="clearHistory" class="btn-clear">履歴クリア</button>
      </div>
    </main>

    <footer>
      <a href="../../index.html" class="back-link">← アプリ一覧に戻る</a>
    </footer>
  </div>

  <script src="app.js"></script>
<script src="../../theme.js"></script>
</body>
</html>
