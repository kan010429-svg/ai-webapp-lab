<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuner - チューナー</title>
  <script>
  (function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../../theme.css" />
<link rel="stylesheet" href="../../app-ui.css" />
<link rel="stylesheet" href="style.css">
</head>
<body class="bt-themed bt-app">
  <div id="app" class="wb-page wb-page-narrow tuner">
    <header class="wb-mast">
      <a class="wb-home" href="../../index.html">Apps</a>
      <div class="wb-title-block">
        <span class="wb-kicker">SoundLab</span>
        <h1 class="wb-title">Tuner</h1>
      </div>
      <div class="theme-switch" role="group" aria-label="テーマ切替">
        <button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button>
        <button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button>
      </div>
    </header>

    <main class="tuner-main">
      <section class="stage">
        <canvas id="waveform" class="waveform"></canvas>
        <div class="note-readout">
          <span class="wb-label">Note</span>
          <div id="noteCircle" class="note-circle">
            <span id="noteName" class="wb-readout wb-readout-xl">-</span>
          </div>
          <div id="frequency" class="frequency">-- Hz</div>
          <div id="cents" class="cents">0¢</div>
        </div>
      </section>

      <section class="tuning-meter">
        <div class="meter-marks">
          <span>-50</span>
          <span>0</span>
          <span>+50</span>
        </div>
        <div class="meter-bar">
          <div id="meterNeedle" class="meter-needle"></div>
        </div>
      </section>

      <section class="controls dock">
        <button id="startBtn" class="btn btn-start wb-btn-key" type="button">Start</button>
        
        <label class="tuning-select wb-field">
          <span>Tuning</span>
          <select id="tuningMode">
            <option value="chromatic">クロマチック</option>
            <option value="guitar">ギター (E A D G B E)</option>
            <option value="bass">ベース (E A D G)</option>
            <option value="ukulele">ウクレレ (G C E A)</option>
          </select>
        </label>

        <label class="reference-pitch">
          <span class="wb-label">Reference A4 <b id="a4Value">440</b> Hz</span>
          <input type="range" id="a4Freq" min="430" max="450" value="440" step="1">
        </label>

        <div class="auto-tune">
          <label><input type="checkbox" id="autoAlert"> 自動アラート（±5¢以内）</label>
        </div>
      </section>

      <div id="stringGuide" class="string-guide"></div>

      <section class="stats wb-well" id="stats">
        <h2 class="wb-label">Stats</h2>
        <div class="stat-grid">
          <div class="stat-item">
            <span class="stat-label">チューニング回数</span>
            <span class="stat-value" id="tuneCount">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">平均精度</span>
            <span class="stat-value" id="avgAccuracy">-</span>
          </div>
        </div>
      </section>

      <section class="history wb-well" id="history">
        <h2 class="wb-label">History</h2>
        <div id="historyList"></div>
        <button id="clearHistory" class="btn-clear wb-btn-quiet" type="button">Clear history</button>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
<script src="../../theme.js"></script>
</body>
</html>
