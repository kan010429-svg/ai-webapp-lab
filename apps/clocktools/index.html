<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ClockTools — 時計・タイマー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2307090d'/%3E%3Ccircle cx='50' cy='50' r='22' fill='none' stroke='%233de0c5' stroke-width='8'/%3E%3C/svg%3E" />
<meta name="description" content="時計・世界時計・ストップウォッチ・タイマー・ポモドーロ・インターバルタイマーを1つにまとめた時間管理アプリ。" />
<script>(function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../../theme.css" />
<style>/* tokens: theme.css */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    display:flex;flex-direction:column;
  }
  button{font-family:inherit;color:inherit}
  .wrap{width:100%;max-width:860px;margin:0 auto;padding:0 20px}

  header{padding:20px 0 0;flex:none}
  .titlebar{display:flex;align-items:center;gap:10px}
  .titlebar h1{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .titlebar .sub{color:var(--muted2);font-size:13px;font-weight:600}
  .titlebar .theme-switch{margin-left:auto}.titlebar .back{color:var(--muted);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;padding:6px 10px;border-radius:8px}
  .titlebar .back:hover{background:var(--panel2);color:var(--text)}

  nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:14px;border-bottom:1px solid var(--border);scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{
    position:relative;background:none;border:0;color:var(--muted);
    font-size:14px;font-weight:600;padding:10px 15px 12px;cursor:pointer;
    white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:color .15s;
  }
  .tab:hover{color:var(--text)}
  .tab::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2.5px;border-radius:2px;background:transparent;transition:background .15s}
  .tab.active{color:var(--text)}
  .tab.active::after{background:linear-gradient(90deg,var(--accent),var(--accent2))}

  main{flex:1;padding:30px 0 60px}
  .view{display:none}
  .view.active{display:block;animation:fadein .18s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
  .card + .card{margin-top:16px}
  .card h2{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:14px;letter-spacing:.02em}

  /* segmented control */
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
  .seg button{background:none;border:0;border-radius:8px;color:var(--muted);font-size:13px;font-weight:600;padding:6px 14px;cursor:pointer;transition:all .12s}
  .seg button:hover{color:var(--text)}
  .seg button.active{background:var(--accent);color:var(--accent-ink)}

  .btn{
    background:var(--panel2);border:1px solid var(--border2);border-radius:12px;
    color:var(--text);font-size:14px;font-weight:700;padding:11px 22px;cursor:pointer;transition:all .12s;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn.danger{color:var(--red)}
  .btn.big{font-size:16px;padding:14px 34px;border-radius:14px}
  .btn:disabled{opacity:.4;cursor:default}
  .btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

  .chip{background:var(--panel2);border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 14px;cursor:pointer;transition:all .12s}
  .chip:hover{color:var(--text);border-color:var(--border2)}
  .chip.active{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

  input[type=number],select{
    background:var(--panel2);border:1px solid var(--border2);border-radius:10px;
    color:var(--text);font-size:15px;padding:9px 12px;outline:none;font-family:inherit;
  }
  input[type=number]:focus,select:focus{border-color:var(--accent)}
  input[type=number]{width:90px;text-align:center}
  label.fld{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;font-weight:600}

  .digits{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* ==== clock view: Digital Monument / Analog Studio ==== */
  .clock-main{
    text-align:center;
    padding:28px 20px 32px;
    background:transparent;
    border:0;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    border-radius:0;
  }
  .clock-modes{
    display:inline-flex;gap:4px;margin-bottom:28px;
    background:none;border:0;padding:0;border-radius:0;
  }
  .clock-modes button{
    position:relative;background:none;border:0;border-radius:0;
    color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;padding:8px 12px;cursor:pointer;
  }
  .clock-modes button:hover{color:var(--text)}
  .clock-modes button.active{color:var(--text);background:none}
  .clock-modes button.active::after{
    content:"";position:absolute;left:12px;right:12px;bottom:2px;height:1px;background:var(--accent);
  }

  /* Digital A — Monument */
  .monument{padding:12px 0 8px}
  .monument-time{
    display:flex;align-items:baseline;justify-content:center;gap:.12em;
    font-family:var(--font-display);font-weight:800;letter-spacing:-.04em;line-height:.95;
    color:var(--title-color);text-shadow:var(--title-glow);
  }
  .monument-hm{font-size:clamp(72px,18vw,140px);font-variant-numeric:tabular-nums}
  .monument-sec{
    font-size:clamp(28px,6vw,48px);font-weight:700;letter-spacing:-.02em;
    color:var(--accent);opacity:.9;min-width:1.6em;text-align:left;
  }
  .monument-date{
    margin-top:14px;font-size:12px;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted2);
  }

  /* Analog C — Studio */
  .studio{display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 0 2px}
  .studio-dial-wrap{
    width:min(320px,72vw);aspect-ratio:1;position:relative;
  }
  .studio-dial-wrap canvas{width:100%;height:100%;display:block}
  .studio-date{
    font-size:12px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted2);
  }

  .wc-add{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .wc-add select{flex:1;min-width:180px}
  .wc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .wc-card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative}
  .wc-card .city{font-weight:700;font-size:14px}
  .wc-card .zone{color:var(--muted2);font-size:11.5px}
  .wc-card .time{font-size:26px;font-weight:800;margin-top:4px}
  .wc-card .diff{color:var(--muted);font-size:12px;margin-top:2px}
  .wc-card .del{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--muted2);cursor:pointer;font-size:14px;padding:4px 7px;border-radius:6px}
  .wc-card .del:hover{background:var(--panel);color:var(--red)}

  /* ==== shared tool surface ==== */
  .tool-surface{
    text-align:center;
    padding:28px 20px 32px;
    background:transparent;
    border:0;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    border-radius:0;
  }
  .tool-actions{margin-top:22px}
  .tool-actions .btn{
    background:none;border:0;border-radius:0;padding:10px 14px;
    font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);
  }
  .tool-actions .btn:hover{color:var(--text);border-color:transparent}
  .tool-actions .btn.primary{background:none;color:var(--text);position:relative}
  .tool-actions .btn.primary::after{
    content:"";position:absolute;left:14px;right:14px;bottom:4px;height:1px;background:var(--accent);
  }
  .tool-actions .btn.danger{color:var(--muted)}
  .tool-actions .btn.danger:hover{color:var(--red)}
  .tool-actions .btn.big{font-size:12px;padding:10px 14px;border-radius:0}
  .tool-actions .btn:disabled{opacity:.35}
  .preset-row{
    display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;
  }
  .preset-row button{
    background:none;border:0;border-radius:0;color:var(--muted);
    font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    padding:6px 10px;cursor:pointer;
  }
  .preset-row button:hover{color:var(--text)}
  .preset-row button.active{color:var(--text);position:relative}
  .preset-row button.active::after{
    content:"";position:absolute;left:10px;right:10px;bottom:2px;height:1px;background:var(--accent);
  }
  .mode-row{
    display:inline-flex;gap:4px;margin-bottom:22px;background:none;border:0;padding:0;
  }
  .mode-row button{
    background:none;border:0;border-radius:0;color:var(--muted);
    font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    padding:8px 12px;cursor:pointer;
  }
  .mode-row button:hover{color:var(--text)}
  .mode-row button.active{color:var(--text);position:relative}
  .mode-row button.active::after{
    content:"";position:absolute;left:12px;right:12px;bottom:2px;height:1px;background:var(--accent);
  }
  .cfg-line{
    display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:18px;
    color:var(--muted2);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  }
  .cfg-line .fld{color:inherit;font-size:inherit;font-weight:inherit;gap:6px}
  .cfg-line input[type=number]{
    width:64px;padding:6px 8px;font-size:13px;border-radius:0;
    background:transparent;border:0;border-bottom:1px solid var(--border2);
  }

  /* ==== Stopwatch C — Split ==== */
  .split-readout{
    display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:end;
    max-width:640px;margin:0 auto;text-align:left;
  }
  .split-label{
    font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted2);margin-bottom:8px;
  }
  .split-main .sw-time{
    text-align:left;font-family:var(--font-display);font-size:clamp(48px,12vw,92px);
    font-weight:800;letter-spacing:-.04em;line-height:.95;padding:0;
    color:var(--title-color);text-shadow:var(--title-glow);
  }
  .split-main .sw-time small{font-size:.42em;color:var(--muted);font-weight:700}
  .split-side{border-left:1px solid var(--border);padding-left:22px}
  .sw-split{
    font-family:var(--font-display);font-size:clamp(28px,6vw,44px);font-weight:800;
    letter-spacing:-.03em;color:var(--accent);line-height:1;
  }
  .sw-lapcount{
    margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted2);
  }
  .laps{margin-top:20px;max-height:240px;overflow-y:auto;border-top:1px solid var(--border);text-align:left}
  .lap{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--border);font-size:13px}
  .lap .n{color:var(--muted2);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
  .lap.best .d{color:var(--green);font-weight:700}
  .lap.worst .d{color:var(--red);font-weight:700}
  .lap .cum{color:var(--muted2)}
  @media (max-width:560px){
    .split-readout{grid-template-columns:1fr;gap:18px}
    .split-side{border-left:0;border-top:1px solid var(--border);padding-left:0;padding-top:16px}
  }

  /* ==== Timer A — Orbit ==== */
  .orbit{display:flex;flex-direction:column;align-items:center}
  .orbit .ringwrap{position:relative;width:min(300px,78vw);margin:6px 0 8px}
  .orbit .ringwrap svg{width:100%;height:auto;display:block;transform:rotate(-90deg)}
  .orbit .ring-bg{fill:none;stroke:var(--border);stroke-width:2.5}
  .orbit .ring-fg{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;transition:stroke .3s}
  .orbit .ring-mark{fill:var(--accent);opacity:.85}
  .orbit .ring-mark.fired{fill:var(--muted2);opacity:.55}
  .orbit .ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .orbit .ring-label .t{
    font-family:var(--font-display);font-size:clamp(44px,12vw,64px);font-weight:800;
    letter-spacing:-.04em;color:var(--title-color);text-shadow:var(--title-glow);line-height:1;
  }
  .orbit .ring-label .s{
    color:var(--muted2);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  }
  .alarm-box{width:100%;max-width:460px;border-top:1px solid var(--border);padding-top:16px;margin-top:18px;text-align:center}
  .alarm-box .cap{color:var(--muted2);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px}
  .alarm-add{display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:12px}
  .alarm-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .achip{
    display:inline-flex;align-items:center;gap:6px;
    background:none;border:0;border-bottom:1px solid var(--border2);
    font-size:12px;font-weight:700;letter-spacing:.06em;padding:6px 4px 6px 2px;border-radius:0;
  }
  .achip.fired{color:var(--muted2);border-color:var(--border)}
  .achip.next{color:var(--accent);border-color:var(--accent)}
  .achip button{background:none;border:0;color:var(--muted2);cursor:pointer;font-size:12px;padding:2px 6px}
  .achip button:hover{color:var(--red)}
  .alarm-note{color:var(--muted2);font-size:12px;margin-top:10px;line-height:1.5}

  /* ==== Pomodoro A — Cycle ==== */
  .cycle{display:flex;flex-direction:column;align-items:center}
  .cycle-ring{position:relative;width:min(300px,78vw);margin:4px 0 10px}
  .cycle-ring svg{width:100%;height:auto;display:block;transform:rotate(-90deg)}
  .cycle-ring .ring-bg{fill:none;stroke:var(--border);stroke-width:2.5}
  .cycle-ring .ring-fg{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;transition:stroke .3s}
  .cycle-ring .ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .cycle-ring .ring-label .t{
    font-family:var(--font-display);font-size:clamp(44px,12vw,64px);font-weight:800;
    letter-spacing:-.04em;color:var(--title-color);text-shadow:var(--title-glow);line-height:1;
  }
  .cycle-ring .ring-label .s{
    color:var(--muted2);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  }
  .cycle-dots{position:absolute;inset:0;pointer-events:none}
  .cycle-dot{
    position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;
    border-radius:50%;background:var(--panel);border:1.5px solid var(--muted2);
    transform-origin:center center;z-index:2;
  }
  .cycle-dot.done{background:var(--accent);border-color:var(--accent)}
  .cycle-stats{
    margin-top:4px;color:var(--muted2);font-size:11px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;
  }
  .cycle-stats b{color:var(--text);font-weight:800}

  /* ==== Interval A — Lane ==== */
  .lane{display:flex;flex-direction:column;align-items:center}
  .lane-phase{
    font-family:var(--font-display);font-size:clamp(28px,7vw,42px);font-weight:800;
    letter-spacing:.18em;text-transform:uppercase;margin:8px 0 6px;line-height:1;
  }
  .lane-time{
    font-family:var(--font-display);font-size:clamp(52px,14vw,88px);font-weight:800;
    letter-spacing:-.04em;color:var(--title-color);text-shadow:var(--title-glow);
    line-height:.95;margin-bottom:22px;
  }
  .lane-track{
    display:flex;gap:6px;width:min(520px,92%);justify-content:center;margin-bottom:14px;
  }
  .lane-seg{
    flex:1;max-width:48px;height:10px;background:var(--panel2);border:1px solid var(--border);
  }
  .lane-seg.done{background:var(--accent);border-color:transparent;opacity:.85}
  .lane-seg.current{background:transparent;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);position:relative;overflow:hidden}
  .lane-seg.current > i{
    position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.55;
  }
  .lane-round{
    color:var(--muted2);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  }

  .settings{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:4px}

  footer{flex:none;padding:0 0 26px;text-align:center;color:var(--muted2);font-size:12.5px}
  @media (max-width:560px){
    .card{padding:18px 14px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body class="bt-themed"><header><div class="wrap"><div class="titlebar"><h1>ClockTools</h1><span class="sub">時計・タイマー</span><div class="theme-switch" role="group" aria-label="テーマ切替"><button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button><button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button></div><a class="back" href="../../index.html">Apps</a></div><nav class="tabs" id="tabs" role="tablist"><button class="tab" data-v="clock">クロック</button><button class="tab" data-v="stopwatch">ストップウォッチ</button><button class="tab" data-v="timer">タイマー</button><button class="tab" data-v="pomodoro">ポモドーロ</button><button class="tab" data-v="interval">インターバル</button></nav></div></header><main><div class="wrap"><!-- クロック --><section class="view" id="view-clock"><div class="card clock-main"><div class="clock-modes seg" id="clock-modes" role="tablist" aria-label="時計表示"><button data-m="digital" class="active" type="button">Digital</button><button data-m="analog" type="button">Analog</button></div><div id="clock-digital" class="monument"><div class="monument-time"><span class="monument-hm digits" id="ck-hm">--:--</span><span class="monument-sec digits" id="ck-sec">--</span></div><div class="monument-date" id="ck-date"></div></div><div id="clock-analog" class="studio" style="display:none"><div class="studio-dial-wrap"><canvas id="ck-canvas" width="640" height="640" aria-label="アナログ時計"></canvas></div><div class="studio-date" id="ck-date-analog"></div></div></div><div class="card"><h2>世界時計</h2><div class="wc-add"><select id="wc-select"></select><button class="btn" id="wc-addbtn">追加</button></div><div class="wc-grid" id="wc-grid"></div></div></section><!-- ストップウォッチ --><section class="view" id="view-stopwatch"><div class="card tool-surface"><div class="split-readout"><div class="split-main"><div class="split-label">Elapsed</div><div class="sw-time digits" id="sw-time">00:00<small>.00</small></div></div><div class="split-side"><div class="split-label">Split</div><div class="sw-split digits" id="sw-split">00:00.00</div><div class="sw-lapcount" id="sw-lapcount">0 LAPS</div></div></div><div class="btnrow tool-actions"><button class="btn primary big" id="sw-start">スタート</button><button class="btn big" id="sw-lap" disabled>ラップ</button><button class="btn big danger" id="sw-reset">リセット</button></div><div class="laps" id="sw-laps" style="display:none"></div></div></section><!-- タイマー --><section class="view" id="view-timer"><div class="card tool-surface orbit"><div class="preset-row" id="tm-presets"></div><div class="settings cfg-line" id="tm-custom"><label class="fld"><input type="number" id="tm-min" min="0" max="999" value="5"> 分</label><label class="fld"><input type="number" id="tm-sec" min="0" max="59" value="0"> 秒</label></div><div class="ringwrap"><svg viewBox="0 0 200 200"><circle class="ring-bg" cx="100" cy="100" r="90"/><g id="tm-marks"></g><circle class="ring-fg" id="tm-ring" cx="100" cy="100" r="90"/></svg><div class="ring-label"><div class="t digits" id="tm-time">05:00</div><div class="s" id="tm-state">Idle</div></div></div><div class="btnrow tool-actions"><button class="btn primary big" id="tm-start">スタート</button><button class="btn big danger" id="tm-reset">リセット</button></div><div class="alarm-box"><div class="cap">Multi Alarm</div><div class="alarm-add"><label class="fld"><input type="number" id="al-min" min="1" max="999" value="5"> 分後</label><button class="btn" id="al-add">追加</button></div><div class="alarm-chips" id="al-chips"></div><div class="alarm-note" id="al-note">「5分後」「10分後」のように複数追加すると、最長の時点までカウントしながら各時点でチャイムが鳴ります。</div></div></div></section><!-- ポモドーロ --><section class="view" id="view-pomodoro"><div class="card tool-surface cycle"><div class="mode-row" id="po-modes"><button data-m="focus" class="active">Focus</button><button data-m="short">Short</button><button data-m="long">Long</button></div><div class="ringwrap cycle-ring"><svg viewBox="0 0 200 200"><circle class="ring-bg" cx="100" cy="100" r="90"/><circle class="ring-fg" id="po-ring" cx="100" cy="100" r="90"/></svg><div class="ring-label"><div class="t digits" id="po-time">25:00</div><div class="s" id="po-state">Focus</div></div><div class="cycle-dots" id="po-dots"></div></div><div class="btnrow tool-actions"><button class="btn primary big" id="po-start">スタート</button><button class="btn big" id="po-skip">スキップ</button><button class="btn big danger" id="po-reset">リセット</button></div><div class="cycle-stats"><b class="digits" id="po-count">0</b> sessions · <b class="digits" id="po-total">0</b> min today</div><div class="settings cfg-line"><label class="fld">Focus <input type="number" id="po-focus" min="1" max="120" value="25"> m</label><label class="fld">Short <input type="number" id="po-short" min="1" max="60" value="5"> m</label><label class="fld">Long <input type="number" id="po-long" min="1" max="90" value="15"> m</label></div></div></section><!-- インターバル --><section class="view" id="view-interval"><div class="card tool-surface lane"><div class="preset-row" id="iv-presets"></div><div class="lane-phase" id="iv-phase">Ready</div><div class="lane-time digits" id="iv-time">00:20</div><div class="lane-track" id="iv-lane" aria-hidden="true"></div><div class="lane-round digits" id="iv-round">Round – / –</div><div class="btnrow tool-actions"><button class="btn primary big" id="iv-start">スタート</button><button class="btn big danger" id="iv-reset">リセット</button></div><div class="cfg-line"><label class="fld">Prep <input type="number" id="iv-prep" min="0" max="120" value="10"> s</label><label class="fld">Work <input type="number" id="iv-work" min="5" max="600" value="20"> s</label><label class="fld">Rest <input type="number" id="iv-rest" min="0" max="600" value="10"> s</label><label class="fld">Rounds <input type="number" id="iv-rounds" min="1" max="50" value="8"></label></div></div></section></div></main><footer>ClockTools — Browser Toys</footer><script src="../../theme.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const store = {
  get(k, d){ try{ const v = localStorage.getItem('clocktools.'+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('clocktools.'+k, JSON.stringify(v)); }catch(e){} }
};

/* ---- beep (Web Audio) ---- */
let actx = null;
function beep(freq=880, dur=.14, when=0, vol=.25){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + .02);
  }catch(e){}
}
const chime = () => { beep(880,.15,0); beep(1175,.15,.18); beep(1568,.3,.36); };

/* ---- tabs ---- */
const VIEWS = ['clock','stopwatch','timer','pomodoro','interval'];
function show(v){
  if (!VIEWS.includes(v)) v = 'clock';
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.v === v));
  VIEWS.forEach(x => $('#view-'+x).classList.toggle('active', x === v));
  history.replaceState(null, '', '#'+v);
  if (v === 'pomodoro' && typeof poRender === 'function') requestAnimationFrame(poRender);
  if (v === 'interval' && typeof ivRender === 'function') requestAnimationFrame(ivRender);
  if (v === 'timer' && typeof tmRender === 'function') requestAnimationFrame(tmRender);
}
$$('.tab').forEach(t => t.addEventListener('click', () => show(t.dataset.v)));
show(location.hash.slice(1) || store.get('view','clock'));
addEventListener('pagehide', () => store.set('view', location.hash.slice(1) || 'clock'));

/* ================= クロック ================= */
const WDAYS_EN = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MONTHS_EN = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
let clockMode = store.get('clockMode','digital');
if (clockMode !== 'digital' && clockMode !== 'analog') clockMode = 'digital';

function setClockMode(m){
  clockMode = m; store.set('clockMode', m);
  $$('#clock-modes button').forEach(b => b.classList.toggle('active', b.dataset.m === m));
  $('#clock-digital').style.display = m === 'digital' ? '' : 'none';
  $('#clock-analog').style.display = m === 'analog' ? '' : 'none';
  clockLoop();
}
$$('#clock-modes button').forEach(b => b.addEventListener('click', () => setClockMode(b.dataset.m)));

function formatClockDate(d){
  return `${WDAYS_EN[d.getDay()]} ${d.getDate()} ${MONTHS_EN[d.getMonth()]}`;
}

const ckCanvas = $('#ck-canvas');
const ckCtx = ckCanvas.getContext('2d');
function drawStudioClock(d){
  const w = ckCanvas.width, h = ckCanvas.height;
  const cx = w/2, cy = h/2, r = w * 0.42;
  const ctx = ckCtx;
  const styles = getComputedStyle(document.documentElement);
  const text = styles.getPropertyValue('--title-color').trim() || '#e8eef7';
  const muted = styles.getPropertyValue('--muted2').trim() || '#5f6b7c';
  const accent = styles.getPropertyValue('--accent').trim() || '#3de0c5';
  const border = styles.getPropertyValue('--border').trim() || '#1e2836';
  const panel = styles.getPropertyValue('--panel').trim() || '#10161f';
  const theme = document.documentElement.getAttribute('data-theme');
  const ink = theme === 'lab' ? (styles.getPropertyValue('--accent').trim() || '#1d6fd8') : accent;

  ctx.clearRect(0,0,w,h);

  // dial face
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = panel;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = border;
  ctx.stroke();

  // ticks
  for (let i = 0; i < 60; i++){
    const a = (i / 60) * Math.PI * 2 - Math.PI/2;
    const major = i % 5 === 0;
    const r0 = r * (major ? 0.78 : 0.86);
    const r1 = r * 0.93;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a)*r0, cy + Math.sin(a)*r0);
    ctx.lineTo(cx + Math.cos(a)*r1, cy + Math.sin(a)*r1);
    ctx.strokeStyle = major ? muted : border;
    ctx.lineWidth = major ? 3 : 1.5;
    ctx.stroke();
  }

  // numerals 12 3 6 9
  ctx.fillStyle = text;
  ctx.font = `700 ${Math.round(w*0.07)}px "IBM Plex Sans JP", system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const nums = [[12,0], [3,3], [6,6], [9,9]];
  nums.forEach(([label, hour]) => {
    const a = (hour / 12) * Math.PI * 2 - Math.PI/2;
    const rr = r * 0.66;
    ctx.fillText(String(label), cx + Math.cos(a)*rr, cy + Math.sin(a)*rr);
  });

  const hh = d.getHours() % 12;
  const mm = d.getMinutes();
  const ss = d.getSeconds();
  const ms = d.getMilliseconds();

  function hand(ang, len, width, color, cap){
    ctx.beginPath();
    ctx.moveTo(cx - Math.cos(ang)*r*0.08, cy - Math.sin(ang)*r*0.08);
    ctx.lineTo(cx + Math.cos(ang)*len, cy + Math.sin(ang)*len);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = cap || 'round';
    ctx.stroke();
  }

  const ah = ((hh + mm/60 + ss/3600) / 12) * Math.PI * 2 - Math.PI/2;
  const am = ((mm + ss/60 + ms/60000) / 60) * Math.PI * 2 - Math.PI/2;
  const as = ((ss + ms/1000) / 60) * Math.PI * 2 - Math.PI/2;

  // hour (thick matte)
  hand(ah, r*0.48, 10, text, 'round');
  // minute (thin)
  hand(am, r*0.68, 4, text, 'round');
  // faint second
  ctx.globalAlpha = 0.45;
  hand(as, r*0.74, 1.5, ink, 'round');
  ctx.globalAlpha = 1;

  // hub
  ctx.beginPath();
  ctx.arc(cx, cy, 7, 0, Math.PI*2);
  ctx.fillStyle = ink;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI*2);
  ctx.fillStyle = text;
  ctx.fill();
}

let clockRaf = 0;
function renderClock(force){
  const d = new Date();
  if (clockMode === 'digital'){
    $('#ck-hm').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    $('#ck-sec').textContent = pad(d.getSeconds());
    $('#ck-date').textContent = formatClockDate(d);
  } else {
    drawStudioClock(d);
    $('#ck-date-analog').textContent = formatClockDate(d);
  }
}
function clockLoop(){
  cancelAnimationFrame(clockRaf);
  const tick = () => {
    renderClock();
    if (clockMode === 'analog') clockRaf = requestAnimationFrame(tick);
  };
  if (clockMode === 'analog') clockRaf = requestAnimationFrame(tick);
  else renderClock(true);
}
document.addEventListener('bt:theme', () => { if (clockMode === 'analog') renderClock(true); if (typeof tmRender==='function') tmRender(); if (typeof poRender==='function') poRender(); if (typeof ivRender==='function') ivRender(); });

/* ---- 世界時計 ---- */
const CITIES = [
  ['東京','Asia/Tokyo'],['ソウル','Asia/Seoul'],['北京','Asia/Shanghai'],['シンガポール','Asia/Singapore'],
  ['デリー','Asia/Kolkata'],['ドバイ','Asia/Dubai'],['モスクワ','Europe/Moscow'],['ベルリン','Europe/Berlin'],
  ['パリ','Europe/Paris'],['ロンドン','Europe/London'],['ニューヨーク','America/New_York'],
  ['シカゴ','America/Chicago'],['ロサンゼルス','America/Los_Angeles'],['ホノルル','Pacific/Honolulu'],
  ['シドニー','Australia/Sydney'],['オークランド','Pacific/Auckland'],['サンパウロ','America/Sao_Paulo'],
];
let wcZones = store.get('worldclock', ['Asia/Tokyo','Europe/London','America/New_York']);
(function(){
  const sel = $('#wc-select');
  CITIES.forEach(([name, tz]) => {
    const o = document.createElement('option'); o.value = tz; o.textContent = `${name} (${tz})`;
    sel.appendChild(o);
  });
})();
$('#wc-addbtn').addEventListener('click', () => {
  const tz = $('#wc-select').value;
  if (!wcZones.includes(tz)){ wcZones.push(tz); store.set('worldclock', wcZones); buildWC(); }
});
function zoneOffsetMin(tz, d){
  const f = new Intl.DateTimeFormat('en-US',{timeZone:tz, hour12:false, year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const p = {}; f.formatToParts(d).forEach(x => p[x.type] = x.value);
  const asUTC = Date.UTC(p.year, p.month-1, p.day, p.hour%24, p.minute, p.second);
  return Math.round((asUTC - d.getTime()) / 60000);
}
let wcEls = [];
function buildWC(){
  const grid = $('#wc-grid'); grid.innerHTML = ''; wcEls = [];
  wcZones.forEach(tz => {
    const city = (CITIES.find(c => c[1] === tz) || [tz.split('/').pop().replace(/_/g,' ')])[0];
    const el = document.createElement('div'); el.className = 'wc-card';
    el.innerHTML = `<div class="city"></div><div class="zone"></div><div class="time digits">--:--</div><div class="diff"></div><button class="del" title="削除">×</button>`;
    el.querySelector('.city').textContent = city;
    el.querySelector('.zone').textContent = tz;
    el.querySelector('.del').addEventListener('click', () => {
      wcZones = wcZones.filter(z => z !== tz); store.set('worldclock', wcZones); buildWC();
    });
    grid.appendChild(el);
    wcEls.push([tz, el]);
  });
  renderWC();
}
function renderWC(){
  const d = new Date();
  const localOff = -d.getTimezoneOffset();
  wcEls.forEach(([tz, el]) => {
    try{
      const t = new Intl.DateTimeFormat('ja-JP',{timeZone:tz, hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);
      el.querySelector('.time').textContent = t;
      const diff = (zoneOffsetMin(tz, d) - localOff) / 60;
      el.querySelector('.diff').textContent = diff === 0 ? '現地と同じ' : (diff > 0 ? '+' : '') + diff + '時間';
    }catch(e){ el.querySelector('.time').textContent = '--:--'; }
  });
}
buildWC();

/* ================= ストップウォッチ ================= */
const sw = { running:false, start:0, elapsed:0, laps:[], raf:0 };
function swFmt(ms, cs=true){
  const c = Math.floor(ms/10)%100, s = Math.floor(ms/1000)%60, m = Math.floor(ms/60000)%60, h = Math.floor(ms/3600000);
  const base = (h>0 ? h+':'+pad(m) : pad(m)) + ':' + pad(s);
  return cs ? base + `<small>.${pad(c)}</small>` : base + '.' + pad(c);
}
function swNow(){ return sw.elapsed + (sw.running ? performance.now() - sw.start : 0); }
function swSplitNow(){
  const total = swNow();
  const prev = sw.laps.length ? sw.laps[sw.laps.length-1].total : 0;
  return total - prev;
}
function swRender(){
  const total = swNow();
  $('#sw-time').innerHTML = swFmt(total);
  $('#sw-split').textContent = swFmt(swSplitNow(), false);
  const shown = sw.laps.length;
  $('#sw-lapcount').textContent = shown + (shown === 1 ? ' LAP' : ' LAPS');
  if (sw.running) sw.raf = requestAnimationFrame(swRender);
}
$('#sw-start').addEventListener('click', () => {
  if (sw.running){
    sw.elapsed = swNow(); sw.running = false;
    cancelAnimationFrame(sw.raf);
    $('#sw-start').textContent = '再開'; $('#sw-start').classList.remove('primary');
    $('#sw-lap').disabled = true;
  } else {
    sw.start = performance.now(); sw.running = true;
    $('#sw-start').textContent = 'ストップ'; $('#sw-start').classList.add('primary');
    $('#sw-lap').disabled = false;
    swRender();
  }
});
$('#sw-lap').addEventListener('click', () => {
  if (!sw.running) return;
  const total = swNow();
  const prev = sw.laps.length ? sw.laps[sw.laps.length-1].total : 0;
  sw.laps.push({ n: sw.laps.length+1, d: total - prev, total });
  renderLaps();
});
$('#sw-reset').addEventListener('click', () => {
  sw.running = false; sw.elapsed = 0; sw.laps = [];
  cancelAnimationFrame(sw.raf);
  $('#sw-start').textContent = 'スタート'; $('#sw-start').classList.add('primary');
  $('#sw-lap').disabled = true;
  $('#sw-time').innerHTML = swFmt(0);
  $('#sw-split').textContent = swFmt(0, false);
  $('#sw-lapcount').textContent = '0 LAPS';
  renderLaps();
});
function renderLaps(){
  const box = $('#sw-laps');
  if (!sw.laps.length){ box.style.display = 'none'; box.innerHTML = ''; return; }
  box.style.display = '';
  let best = Infinity, worst = -1;
  if (sw.laps.length >= 2) sw.laps.forEach(l => { best = Math.min(best, l.d); worst = Math.max(worst, l.d); });
  box.innerHTML = [...sw.laps].reverse().map(l => {
    const cls = sw.laps.length >= 2 ? (l.d === best ? ' best' : l.d === worst ? ' worst' : '') : '';
    return `<div class="lap${cls}"><span class="n">Lap ${l.n}</span><span class="d digits">${swFmt(l.d,false)}</span><span class="cum digits">${swFmt(l.total,false)}</span></div>`;
  }).join('');
}

/* ---- 共通リング ---- */
const CIRC = 2 * Math.PI * 90;
function setRing(el, ratio, color){
  el.style.strokeDasharray = CIRC;
  el.style.strokeDashoffset = CIRC * (1 - Math.max(0, Math.min(1, ratio)));
  if (color) el.style.stroke = color;
}

/* ================= タイマー ================= */
const tm = { running:false, total:300, left:300, endAt:0, int:0 };
const TM_PRESETS = [[1,'1分'],[3,'3分'],[5,'5分'],[10,'10分'],[15,'15分'],[30,'30分'],[60,'60分']];
(function(){
  const box = $('#tm-presets');
  TM_PRESETS.forEach(([min, label]) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
    b.addEventListener('click', () => {
      $('#tm-min').value = min; $('#tm-sec').value = 0;
      tmStop(); tmSetFromInputs();
      $$('#tm-presets button').forEach(c => c.classList.toggle('active', c === b));
    });
    box.appendChild(b);
  });
})();
function tmSetFromInputs(){
  if (tm.alarms.length){
    tm.total = tm.left = Math.max(...tm.alarms.map(a => a.min)) * 60;
  } else {
    const m = Math.max(0, +$('#tm-min').value || 0), s = Math.max(0, Math.min(59, +$('#tm-sec').value || 0));
    tm.total = tm.left = Math.max(1, m*60 + s);
  }
  tmRender();
}
['tm-min','tm-sec'].forEach(id => $('#'+id).addEventListener('input', () => { if (!tm.running) tmSetFromInputs(); }));
function tmRenderMarks(){
  const g = $('#tm-marks'); if (!g) return;
  g.innerHTML = '';
  if (!tm.alarms.length || !tm.total) return;
  const R = 90;
  tm.alarms.forEach(a => {
    const ratio = Math.min(1, (a.min * 60) / tm.total);
    // ring SVG is rotated -90deg in CSS; place marks in unrotated user space along circle from top via CSS rotation parent
    // marks live inside rotated SVG, so angle 0 = right; CSS rotate -90 makes 0 = top. Elapsed grows clockwise from top.
    // remaining ring uses dashoffset from full; alarms at elapsed minutes from start => angle = ratio * 2pi from top = from 0 in pre-rotated svg (since -90 already).
    const ang = ratio * Math.PI * 2;
    const x = 100 + Math.cos(ang) * R;
    const y = 100 + Math.sin(ang) * R;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', a.fired ? 2.2 : 3);
    c.setAttribute('class', 'ring-mark' + (a.fired ? ' fired' : ''));
    g.appendChild(c);
  });
}
function tmRender(){
  const s = Math.ceil(tm.left);
  $('#tm-time').textContent = `${pad(Math.floor(s/60))}:${pad(s%60)}`;
  const next = tm.alarms.find(a => !a.fired);
  $('#tm-state').textContent = tm.running
    ? (next ? `Next ${next.min}m` : 'Remaining')
    : (tm.left < tm.total ? 'Paused' : 'Idle');
  setRing($('#tm-ring'), tm.total ? tm.left/tm.total : 0, tm.left <= 10 && tm.running ? 'var(--red)' : 'var(--accent)');
  tmRenderMarks();
  document.title = tm.running ? `(${pad(Math.floor(s/60))}:${pad(s%60)}) ClockTools` : 'ClockTools — 時計・タイマー';
}
function tmTick(){
  tm.left = Math.max(0, (tm.endAt - performance.now()) / 1000);
  const elapsed = tm.total - tm.left;
  tm.alarms.forEach(a => {
    if (!a.fired && a.min * 60 <= elapsed && a.min * 60 < tm.total){
      a.fired = true;
      beep(988,.14,0); beep(1319,.22,.17);
      alRender();
    }
  });
  if (tm.left <= 0){
    tmStop(); tm.left = 0; chime();
    tm.alarms.forEach(a => a.fired = true); alRender();
    $('#tm-state').textContent = 'Done';
  }
  tmRender();
}
function tmStop(){ tm.running = false; clearInterval(tm.int); $('#tm-start').textContent = tm.left < tm.total && tm.left > 0 ? '再開' : 'スタート'; }
$('#tm-start').addEventListener('click', () => {
  if (tm.running){ tmStop(); tmRender(); return; }
  if (tm.left <= 0){ tmSetFromInputs(); alReset(); }
  else if (tm.left === tm.total) alReset();
  tm.endAt = performance.now() + tm.left * 1000;
  tm.running = true; tm.int = setInterval(tmTick, 200);
  $('#tm-start').textContent = '一時停止';
  beep(660,.08);
  tmRender();
});
$('#tm-reset').addEventListener('click', () => { tmStop(); alReset(); tmSetFromInputs(); $('#tm-start').textContent = 'スタート'; });

/* ---- マルチアラーム ---- */
tm.alarms = (store.get('alarms', [])).map(min => ({min, fired:false}));
function alSave(){ store.set('alarms', tm.alarms.map(a => a.min)); }
function alReset(){ tm.alarms.forEach(a => a.fired = false); alRender(); }
function alRender(){
  const box = $('#al-chips'); box.innerHTML = '';
  const next = tm.alarms.find(a => !a.fired);
  tm.alarms.forEach((a, i) => {
    const chip = document.createElement('span');
    chip.className = 'achip' + (a.fired ? ' fired' : a === next ? ' next' : '');
    chip.innerHTML = `${a.min}分後<button title="削除">×</button>`;
    chip.querySelector('button').addEventListener('click', () => {
      tm.alarms.splice(i, 1); alSave(); alRender();
      if (!tm.running) tmSetFromInputs();
    });
    box.appendChild(chip);
  });
  $('#tm-custom').style.display = tm.alarms.length ? 'none' : '';
  $('#tm-presets').style.display = tm.alarms.length ? 'none' : '';
  $('#al-note').textContent = tm.alarms.length
    ? `${tm.alarms.map(a => a.min + '分後').join('・')}にチャイムが鳴ります（最長 ${Math.max(...tm.alarms.map(a => a.min))}分でカウント終了）。`
    : '「5分後」「10分後」のように複数追加すると、最長の時点までカウントしながら各時点でチャイムが鳴ります。';
}
$('#al-add').addEventListener('click', () => {
  const min = Math.max(1, Math.min(999, Math.round(+$('#al-min').value || 0)));
  if (!min || tm.alarms.some(a => a.min === min) || tm.alarms.length >= 8) return;
  tm.alarms.push({min, fired: tm.running && (tm.total - tm.left) >= min * 60});
  tm.alarms.sort((a, b) => a.min - b.min);
  alSave(); alRender();
  if (!tm.running) tmSetFromInputs();
});
alRender();
tmSetFromInputs();

/* ================= ポモドーロ ================= */
const po = {
  mode:'focus', running:false, left:25*60, endAt:0, int:0,
  count: store.get('pomoCount', 0), totalMin: store.get('pomoMin', 0),
  day: store.get('pomoDay', ''),
};
(function(){ // reset daily stats
  const today = new Date().toISOString().slice(0,10);
  if (po.day !== today){ po.count = 0; po.totalMin = 0; po.day = today; poSaveStats(); }
})();
function poSaveStats(){ store.set('pomoCount', po.count); store.set('pomoMin', po.totalMin); store.set('pomoDay', po.day); }
const PO_LABEL = { focus:'Focus', short:'Short', long:'Long' };
const PO_COLOR = { focus:'var(--red)', short:'var(--green)', long:'var(--accent2)' };
function poDur(m){ return Math.max(1, +($('#po-'+(m==='focus'?'focus':m==='short'?'short':'long')).value) || 1) * 60; }
function poSet(mode){
  po.mode = mode; poStop(); po.left = poDur(mode);
  $$('#po-modes button').forEach(b => b.classList.toggle('active', b.dataset.m === mode));
  poRender();
}
$$('#po-modes button').forEach(b => b.addEventListener('click', () => poSet(b.dataset.m)));
['po-focus','po-short','po-long'].forEach(id => $('#'+id).addEventListener('input', () => { if (!po.running) poSet(po.mode); }));
function poRender(){
  const s = Math.ceil(po.left);
  $('#po-time').textContent = `${pad(Math.floor(s/60))}:${pad(s%60)}`;
  $('#po-state').textContent = PO_LABEL[po.mode];
  setRing($('#po-ring'), po.left / poDur(po.mode), PO_COLOR[po.mode]);
  $('#po-count').textContent = po.count;
  $('#po-total').textContent = po.totalMin;
  const dots = $('#po-dots'); dots.innerHTML = '';
  const wrap = dots.parentElement;
  const radius = Math.max((wrap && wrap.clientWidth) ? wrap.clientWidth * 0.46 : 0, 120);
  for (let i = 0; i < 4; i++){
    const d = document.createElement('div');
    const done = po.count > 0 && (po.count % 4 === 0 || i < po.count % 4);
    d.className = 'cycle-dot' + (done ? ' done' : '');
    const ang = (-90 + i * 90) * Math.PI / 180;
    d.style.transform = `translate(${Math.cos(ang)*radius}px, ${Math.sin(ang)*radius}px)`;
    dots.appendChild(d);
  }
}
function poStop(){ po.running = false; clearInterval(po.int); $('#po-start').textContent = 'スタート'; }
function poAdvance(){
  chime();
  if (po.mode === 'focus'){
    po.count++; po.totalMin += Math.round(poDur('focus')/60); poSaveStats();
    poSet(po.count % 4 === 0 ? 'long' : 'short');
  } else {
    poSet('focus');
  }
}
function poTick(){
  po.left = Math.max(0, (po.endAt - performance.now()) / 1000);
  if (po.left <= 0){ poStop(); poAdvance(); return; }
  poRender();
}
$('#po-start').addEventListener('click', () => {
  if (po.running){ poStop(); poRender(); return; }
  po.endAt = performance.now() + po.left * 1000;
  po.running = true; po.int = setInterval(poTick, 200);
  $('#po-start').textContent = '一時停止';
  beep(660,.08);
});
$('#po-skip').addEventListener('click', () => { poStop(); poAdvance(); });
$('#po-reset').addEventListener('click', () => poSet(po.mode));
poSet('focus');

/* ================= インターバル ================= */
const iv = { running:false, phase:'ready', round:0, left:0, endAt:0, int:0 };
const IV_PRESETS = {
  'Tabata': {prep:10, work:20, rest:10, rounds:8},
  'HIIT':   {prep:10, work:40, rest:20, rounds:10},
  'EMOM':   {prep:10, work:60, rest:0,  rounds:10},
  '30-30':  {prep:10, work:30, rest:30, rounds:10},
};
(function(){
  const box = $('#iv-presets');
  Object.entries(IV_PRESETS).forEach(([name, p]) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = name;
    b.addEventListener('click', () => {
      ivStopAll();
      $('#iv-prep').value = p.prep; $('#iv-work').value = p.work;
      $('#iv-rest').value = p.rest; $('#iv-rounds').value = p.rounds;
      $$('#iv-presets button').forEach(c => c.classList.toggle('active', c === b));
      ivRenderIdle();
    });
    box.appendChild(b);
  });
})();
const IV_META = {
  ready: ['Ready', 'var(--muted)'],
  prep:  ['Prep',  'var(--yellow)'],
  work:  ['Work',  'var(--red)'],
  rest:  ['Rest',  'var(--green)'],
  done:  ['Done',  'var(--accent2)'],
};
function ivCfg(){
  return {
    prep: Math.max(0, +$('#iv-prep').value || 0),
    work: Math.max(1, +$('#iv-work').value || 1),
    rest: Math.max(0, +$('#iv-rest').value || 0),
    rounds: Math.max(1, +$('#iv-rounds').value || 1),
  };
}
function ivPhaseDur(){ const c = ivCfg(); return iv.phase === 'prep' ? c.prep : iv.phase === 'work' ? c.work : iv.phase === 'rest' ? c.rest : 0; }
function ivRenderLane(){
  const track = $('#iv-lane'); if (!track) return;
  const c = ivCfg();
  const dur = ivPhaseDur();
  const progress = dur ? Math.max(0, Math.min(1, 1 - iv.left/dur)) : 0;
  let html = '';
  for (let i = 1; i <= c.rounds; i++){
    let cls = 'lane-seg';
    let fill = '';
    if (iv.phase === 'ready'){
      html += `<div class="${cls}"></div>`;
      continue;
    }
    if (iv.phase === 'done' || iv.round > i || (iv.round === i && iv.phase === 'rest')){
      cls += ' done';
    } else if ((iv.phase === 'work' && iv.round === i) || (iv.phase === 'prep' && i === 1)){
      cls += ' current';
      fill = `<i style="width:${progress*100}%"></i>`;
    }
    html += `<div class="${cls}">${fill}</div>`;
  }
  track.innerHTML = html;
}
function ivRender(){
  const [label, color] = IV_META[iv.phase];
  $('#iv-phase').textContent = label;
  $('#iv-phase').style.color = color;
  const s = Math.ceil(iv.left);
  $('#iv-time').textContent = `${pad(Math.floor(s/60))}:${pad(s%60)}`;
  const c = ivCfg();
  if (iv.phase === 'ready' || iv.phase === 'done' || iv.phase === 'prep'){
    $('#iv-round').textContent = `Round – / ${c.rounds}`;
  } else {
    $('#iv-round').textContent = `Round ${iv.round} / ${c.rounds}`;
  }
  ivRenderLane();
}
function ivRenderIdle(){
  iv.phase = 'ready'; iv.round = 0; iv.left = ivCfg().work; ivRender();
}
function ivEnter(phase){
  const c = ivCfg();
  iv.phase = phase;
  if (phase === 'work') beep(1175,.18);
  else if (phase === 'rest') beep(587,.18);
  else if (phase === 'prep') beep(880,.12);
  else if (phase === 'done'){ chime(); ivStopAll(); iv.left = 0; ivRender(); return; }
  iv.left = phase === 'prep' ? c.prep : phase === 'work' ? c.work : c.rest;
  if (iv.left <= 0){ ivNext(); return; }
  iv.endAt = performance.now() + iv.left * 1000;
  ivRender();
}
function ivNext(){
  const c = ivCfg();
  if (iv.phase === 'prep'){ iv.round = 1; ivEnter('work'); }
  else if (iv.phase === 'work'){
    if (iv.round >= c.rounds) ivEnter('done');
    else ivEnter('rest');
  }
  else if (iv.phase === 'rest'){ iv.round++; ivEnter('work'); }
}
function ivTick(){
  iv.left = Math.max(0, (iv.endAt - performance.now()) / 1000);
  if (iv.left <= 0){ ivNext(); if (!iv.running) return; }
  ivRender();
}
function ivStopAll(){ iv.running = false; clearInterval(iv.int); $('#iv-start').textContent = 'スタート'; }
$('#iv-start').addEventListener('click', () => {
  if (iv.running){ // pause
    ivStopAll(); $('#iv-start').textContent = '再開'; ivRender(); return;
  }
  if (iv.phase === 'ready' || iv.phase === 'done'){
    iv.round = 0;
    iv.running = true; iv.int = setInterval(ivTick, 150);
    ivEnter(ivCfg().prep > 0 ? 'prep' : (iv.round = 1, 'work'));
  } else { // resume
    iv.endAt = performance.now() + iv.left * 1000;
    iv.running = true; iv.int = setInterval(ivTick, 150);
  }
  $('#iv-start').textContent = '一時停止';
});
$('#iv-reset').addEventListener('click', () => { ivStopAll(); ivRenderIdle(); });
['iv-prep','iv-work','iv-rest','iv-rounds'].forEach(id =>$('#'+id).addEventListener('input', () => { if (!iv.running) ivRenderIdle(); }));
ivRenderIdle();

/* ---- global 1s tick for clock ---- */
setClockMode(clockMode);
setInterval(() => { if (clockMode === 'digital') renderClock(); renderWC(); }, 1000);
</script></body></html>
