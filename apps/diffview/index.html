<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diff — テキスト差分</title>
  <script>
  (function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>
  <link rel="stylesheet" href="../../theme.css" />
  <link rel="stylesheet" href="../../app-ui.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body class="bt-themed bt-app">
  <div class="wb-page wb-page-wide">
    <header class="wb-mast">
      <a class="wb-home" href="../../index.html">Apps</a>
      <div class="wb-title-block">
        <span class="wb-kicker">TextTools</span>
        <h1 class="wb-title">Diff</h1>
      </div>
      <div class="theme-switch" role="group" aria-label="テーマ切替">
        <button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button>
        <button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button>
      </div>
    </header>

    <div class="command">
      <div class="wb-actions">
        <button id="compareBtn" class="wb-btn-key" type="button">Compare</button>
        <button id="sampleBtn" class="wb-btn-quiet" type="button">Load sample</button>
        <button id="clearBtn" class="wb-btn-quiet" type="button">Clear</button>
      </div>
      <label class="opt">
        <input type="checkbox" id="ignoreWhitespace">
        Ignore whitespace
      </label>
      <div class="counts">
        <span>+<b id="addedCount">0</b></span>
        <span>-<b id="removedCount">0</b></span>
        <span>=<b id="unchangedCount">0</b></span>
      </div>
    </div>

    <div class="editors">
      <section>
        <div class="pane-label"><span class="wb-label">Before</span></div>
        <textarea id="inputA" placeholder="変更前"></textarea>
      </section>
      <section>
        <div class="pane-label"><span class="wb-label">After</span></div>
        <textarea id="inputB" placeholder="変更後"></textarea>
      </section>
    </div>
    <p id="status" class="status"></p>
    <section class="result">
      <div class="pane-label"><span class="wb-label">Result</span></div>
      <div id="diffOutput" class="diff-output">
        <div class="empty-state">左右のテキストを入れて Compare を押してください</div>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
  <script src="../../theme.js"></script>
</body>
</html>
