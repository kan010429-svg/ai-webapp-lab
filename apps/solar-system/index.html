<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar System</title>
  <script>
  (function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../../theme.css" />
<link rel="stylesheet" href="../../app-ui.css" />
<link rel="stylesheet" href="style.css">
</head>
<body class="bt-themed bt-app bt-canvas-app">
  <div class="container">
    <header>
      <div class="bt-appbar"><div class="theme-switch" role="group" aria-label="テーマ切替">
        <button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button>
        <button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button>
      </div></div>

      <h1>🪐 Solar System</h1>
      <p class="subtitle">太陽系ビューアー</p>
    </header>

    <div class="view-container">
      <canvas id="canvas"></canvas>
      
      <div class="controls">
        <button class="control-btn" id="play-btn">▶️</button>
        <button class="control-btn" id="pause-btn">⏸️</button>
        <button class="control-btn" id="reset-btn">🔄</button>
        <div class="speed-control">
          <label>速度</label>
          <input type="range" id="speed-slider" min="0.1" max="5" step="0.1" value="1">
          <span id="speed-value">1x</span>
        </div>
      </div>
    </div>

    <div class="planet-selector">
      <button class="planet-btn active" data-planet="sun">☀️ 太陽</button>
      <button class="planet-btn" data-planet="mercury">☿️ 水星</button>
      <button class="planet-btn" data-planet="venus">♀️ 金星</button>
      <button class="planet-btn" data-planet="earth">🌍 地球</button>
      <button class="planet-btn" data-planet="mars">♂️ 火星</button>
      <button class="planet-btn" data-planet="jupiter">♃ 木星</button>
      <button class="planet-btn" data-planet="saturn">♄ 土星</button>
      <button class="planet-btn" data-planet="uranus">♅ 天王星</button>
      <button class="planet-btn" data-planet="neptune">♆ 海王星</button>
    </div>

    <div class="info-panel" id="info-panel">
      <h2 id="planet-name">太陽</h2>
      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">直径</div>
          <div class="info-value" id="diameter">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">質量</div>
          <div class="info-value" id="mass">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">公転周期</div>
          <div class="info-value" id="orbit-period">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">自転周期</div>
          <div class="info-value" id="rotation-period">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">平均温度</div>
          <div class="info-value" id="temperature">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">衛星数</div>
          <div class="info-value" id="moons">-</div>
        </div>
      </div>
      <div class="description" id="description"></div>
    </div>
  </div>

  <script src="app.js"></script>
<script src="../../theme.js"></script>
</body>
</html>
