<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Weather Art</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><h1>🌤️ Weather Art</h1><div class="controls"><select id="mode"><option value="sunny">☀️ Sunny</option><option value="rain">🌧️ Rain</option><option value="snow">❄️ Snow</option><option value="storm">⛈️ Storm</option><option value="aurora">🌌 Aurora</option></select><select id="timeOfDay"><option value="day">🌅 Day</option><option value="sunset">🌇 Sunset</option><option value="night">🌙 Night</option></select><label>風: <input type="range" id="wind" min="0" max="10" value="5" step="1"></label><label>密度: <input type="range" id="density" min="50" max="500" value="200" step="50"></label><label><input type="checkbox" id="autoMode"> 自動</label><button id="screenshot">📷 保存</button></div></header><canvas id="c"></canvas></div><script src="app.js"></script></body></html>
