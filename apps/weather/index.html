<!DOCTYPE html><html lang="ja" data-theme="cyber"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Weather Art</title><script>(function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../../theme.css" />
<link rel="stylesheet" href="../../app-ui.css" />
<link rel="stylesheet" href="style.css"></head><body class="bt-themed bt-app bt-canvas-app"><div id="app"><header><div class="bt-appbar"><div class="theme-switch" role="group" aria-label="テーマ切替"><button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button><button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button></div></div>
<h1>Weather Art</h1><div class="controls"><select id="mode"><option value="sunny">Sunny</option><option value="rain">Rain</option><option value="snow">Snow</option><option value="storm">Storm</option><option value="aurora">Aurora</option></select><select id="timeOfDay"><option value="day">Day</option><option value="sunset">Sunset</option><option value="night">Night</option></select><label>風: <input type="range" id="wind" min="0" max="10" value="5" step="1"></label><label>密度: <input type="range" id="density" min="50" max="500" value="200" step="50"></label><label><input type="checkbox" id="autoMode"> 自動</label><button id="screenshot">Save</button></div></header><canvas id="c"></canvas></div><script src="app.js"></script><script src="../../theme.js"></script></body></html>
