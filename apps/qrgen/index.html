<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Generator - QRコード生成</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>📱 QR Generator</h1>
      <p class="subtitle">QRコード生成ツール</p>
    </header>

    <main>
      <div class="input-section">
        <div class="template-tabs">
          <button class="template-btn active" data-type="text">📝 テキスト</button>
          <button class="template-btn" data-type="wifi">📶 WiFi</button>
          <button class="template-btn" data-type="vcard">👤 連絡先</button>
        </div>

        <div id="textTemplate" class="template-content">
          <label for="textInput">テキスト・URL</label>
          <textarea id="textInput" placeholder="QRコードにするテキストやURLを入力...">https://example.com</textarea>
        </div>

        <div id="wifiTemplate" class="template-content" style="display: none;">
          <div class="form-group">
            <label for="wifiSSID">ネットワーク名（SSID）</label>
            <input type="text" id="wifiSSID" placeholder="WiFi名">
          </div>
          <div class="form-group">
            <label for="wifiPassword">パスワード</label>
            <input type="text" id="wifiPassword" placeholder="パスワード">
          </div>
          <div class="form-group">
            <label for="wifiSecurity">セキュリティ</label>
            <select id="wifiSecurity">
              <option value="WPA">WPA/WPA2</option>
              <option value="WEP">WEP</option>
              <option value="nopass">なし</option>
            </select>
          </div>
        </div>

        <div id="vcardTemplate" class="template-content" style="display: none;">
          <div class="form-group">
            <label for="vcardName">名前</label>
            <input type="text" id="vcardName" placeholder="山田 太郎">
          </div>
          <div class="form-group">
            <label for="vcardPhone">電話番号</label>
            <input type="tel" id="vcardPhone" placeholder="090-1234-5678">
          </div>
          <div class="form-group">
            <label for="vcardEmail">メールアドレス</label>
            <input type="email" id="vcardEmail" placeholder="example@email.com">
          </div>
          <div class="form-group">
            <label for="vcardOrg">会社名</label>
            <input type="text" id="vcardOrg" placeholder="株式会社サンプル">
          </div>
        </div>
        
        <div class="options">
          <div class="option-group">
            <label for="size">サイズ</label>
            <select id="size">
              <option value="4">小 (128px)</option>
              <option value="6" selected>中 (192px)</option>
              <option value="8">大 (256px)</option>
              <option value="10">特大 (320px)</option>
            </select>
          </div>

          <div class="option-group">
            <label for="fgColor">前景色</label>
            <input type="color" id="fgColor" value="#000000">
          </div>

          <div class="option-group">
            <label for="bgColor">背景色</label>
            <input type="color" id="bgColor" value="#ffffff">
          </div>
        </div>

        <button id="generateBtn" class="btn btn-generate">生成</button>
      </div>

      <div class="output-section">
        <div id="qrDisplay" class="qr-display">
          <canvas id="qrCanvas"></canvas>
        </div>
        
        <button id="downloadBtn" class="btn btn-download">📥 ダウンロード</button>

        <div class="history-section">
          <h3>履歴</h3>
          <div id="historyList" class="history-list"></div>
        </div>
      </div>
    </main>

    <footer>
      <a href="../../index.html" class="back-link">← アプリ一覧に戻る</a>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
