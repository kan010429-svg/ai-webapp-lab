<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Metronome</title><script>(function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script><link rel="stylesheet" href="../../theme.css" /><link rel="stylesheet" href="../../app-ui.css" /><link rel="stylesheet" href="style.css"></head>
<body class="bt-themed bt-app"><div class="wb-page wb-page-narrow metro"><header class="wb-mast"><a class="wb-home" href="../../index.html">Apps</a><div class="wb-title-block"><span class="wb-kicker">SoundLab</span><h1 class="wb-title">Metronome</h1></div><div class="theme-switch" role="group" aria-label="テーマ切替"><button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button><button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button></div></header><section class="stage"><div id="visualBeat" class="pulse-ring" aria-hidden="true"></div><div class="bpm-block"><span class="wb-label">BPM</span><div class="wb-readout wb-readout-xl" id="bpmValue">120</div><div class="beat-read"><span id="currentBeat">1</span><span class="slash">/</span><span id="totalBeats">4</span></div></div></section><section class="dock"><label class="slider"><span class="wb-label">Tempo</span><input type="range" id="bpmSlider" min="40" max="240" value="120" step="1"></label><div class="tempo-presets"><button class="preset-btn" data-bpm="60" type="button">60</button><button class="preset-btn" data-bpm="90" type="button">90</button><button class="preset-btn" data-bpm="120" type="button">120</button><button class="preset-btn" data-bpm="160" type="button">160</button></div><div class="grid-2"><label class="wb-field"><span>Meter</span><select id="timeSignature"><option value="1">1/4</option><option value="2">2/4</option><option value="3">3/4</option><option value="4" selected>4/4</option><option value="5">5/4</option><option value="6">6/8</option><option value="7">7/8</option></select></label><label class="wb-field"><span>Division</span><select id="subdivision"><option value="1" selected>Quarter</option><option value="2">Eighth</option><option value="4">Sixteenth</option></select></label></div><label class="slider"><span class="wb-label">Volume <b id="volumeValue">80</b>%</span><input type="range" id="volumeSlider" min="0" max="100" value="80" step="1"></label><label class="check"><input type="checkbox" id="accentFirst" checked>Accent beat 1
      </label><div class="transport"><button id="startBtn" class="wb-btn-key go" type="button">Start</button><button id="tapBtn" class="wb-btn" type="button">Tap tempo</button></div><div class="presets"><button id="savePresetBtn" class="wb-btn-quiet" type="button">Save preset</button><select id="presetSelect"><option value="">Presets</option></select><button id="deletePresetBtn" class="wb-btn-quiet" type="button">Delete</button></div></section></div><script src="app.js"></script><script src="../../theme.js"></script></body></html>
