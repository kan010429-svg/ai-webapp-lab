<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="controls">
    <h2>🌦️ Weather Simulator</h2>
    <div class="weather-buttons">
      <button data-weather="sunny">☀️ 晴れ</button>
      <button data-weather="rainy">🌧️ 雨</button>
      <button data-weather="snowy">❄️ 雪</button>
      <button data-weather="stormy">⚡ 嵐</button>
      <button data-weather="cloudy">☁️ 曇り</button>
    </div>
    <div class="slider-group">
      <label>風速: <span id="windValue">5</span></label>
      <input type="range" id="windSpeed" min="0" max="20" value="5">
    </div>
    <div class="slider-group">
      <label>強度: <span id="intensityValue">50</span></label>
      <input type="range" id="intensity" min="10" max="100" value="50">
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
