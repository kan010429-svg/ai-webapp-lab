<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CharCount — 文字数カウンター</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2307090d'/%3E%3Ccircle cx='50' cy='50' r='22' fill='none' stroke='%233de0c5' stroke-width='8'/%3E%3C/svg%3E"><script>(function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script><link rel="stylesheet" href="../../theme.css" /><link rel="stylesheet" href="../../app-ui.css" /><link rel="stylesheet" href="style.css"></head>
<body class="bt-themed bt-app"><div class="wb-page"><header class="wb-mast"><a class="wb-home" href="../../index.html">Apps</a><div class="wb-title-block"><span class="wb-kicker">TextTools</span><h1 class="wb-title">CharCount</h1></div><div class="theme-switch" role="group" aria-label="テーマ切替"><button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button><button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button></div></header><div class="wb-split"><section class="composer"><div class="composer-head"><span class="wb-label">Input</span><div class="wb-actions"><button id="sampleBtn" class="wb-btn-quiet" type="button">Sample</button><button id="clearBtn" class="wb-btn-quiet" type="button">Clear</button></div></div><textarea id="text" placeholder="文章を入力または貼り付け" spellcheck="false"></textarea></section><aside class="side"><div class="hero-stat"><span class="wb-label">Characters</span><div class="wb-readout wb-readout-xl" id="statAll">0</div></div><div class="wb-metrics side-metrics"><div class="wb-metric"><span class="wb-label">Lines</span><b id="statLines">0</b></div><div class="wb-metric"><span class="wb-label">Paragraphs</span><b id="statParagraphs">0</b></div><div class="wb-metric"><span class="wb-label">Bytes</span><b id="statBytes">0</b></div><div class="wb-metric is-accent"><span class="wb-label">Genko</span><b id="genkoPages">0</b></div></div><p class="side-note">原稿用紙換算 <span id="genkoExact">0.00</span> 枚（400字詰め・改行含む）</p></aside></div><section class="wb-well details"><div class="detail-grid"><div><h2 class="wb-label">Whitespace matrix</h2><table class="matrix"><thead><tr><th></th><th>With spaces</th><th>No spaces</th></tr></thead><tbody><tr><th>With breaks</th><td id="cntAllAll">0</td><td id="cntAllNoSpace">0</td></tr><tr><th>No breaks</th><td id="cntNoNlAll">0</td><td id="cntNoNlNoSpace">0</td></tr></tbody></table></div><div><h2 class="wb-label">Width mix</h2><div class="mix-row"><span>全角 <strong id="zenCount">0</strong></span><span>半角 <strong id="hanCount">0</strong></span></div><div class="bar"><div class="bar-fill zen" id="zenBar" style="width:0%"></div></div><h2 class="wb-label sns-label">X / Twitter</h2><div class="mix-row"><span><strong id="xCount">0</strong> / 280</span></div><div class="bar"><div class="bar-fill x" id="xBar" style="width:0%"></div></div></div></div></section></div><script src="app.js"></script><script src="../../theme.js"></script></body></html>
