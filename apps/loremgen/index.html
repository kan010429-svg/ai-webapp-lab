<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorem Generator - ダミーテキスト生成</title>
  <link rel="icon" href="data:,">
  <script>
  (function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../../theme.css" />
<link rel="stylesheet" href="style.css">
</head>
<body class="bt-themed">
  <div id="app">
    <header>
      <div class="bt-appbar"><div class="theme-switch" role="group" aria-label="テーマ切替">
        <button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button>
        <button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button>
      </div></div>

      <h1>📝 Lorem Generator</h1>
      <p class="subtitle">ダミーテキスト生成ツール (Lorem Ipsum / 日本語)</p>
    </header>

    <main>
      <div class="options">
        <div class="option-group">
          <label for="langSelect">言語</label>
          <select id="langSelect">
            <option value="en">Lorem Ipsum (英語)</option>
            <option value="ja">日本語</option>
          </select>
        </div>

        <div class="option-group">
          <label for="typeSelect">単位</label>
          <select id="typeSelect">
            <option value="paragraphs">段落</option>
            <option value="sentences">文</option>
            <option value="words">単語</option>
          </select>
        </div>

        <div class="option-group">
          <label for="countInput">数量</label>
          <input type="number" id="countInput" min="1" max="50" value="3">
        </div>

        <div class="option-group checkbox-group">
          <label>
            <input type="checkbox" id="htmlWrapToggle">
            &lt;p&gt;タグで囲む
          </label>
        </div>
      </div>

      <div class="controls">
        <button id="generateBtn" class="btn primary">生成</button>
        <button id="copyBtn" class="btn">コピー</button>
        <button id="clearBtn" class="btn">クリア</button>
      </div>

      <div id="status" class="status"></div>

      <div class="result-panel">
        <div class="panel-header">
          生成結果 <span id="charCount" class="count-badge">0文字</span>
        </div>
        <textarea id="resultOutput" readonly placeholder="「生成」ボタンを押すとダミーテキストが表示されます"></textarea>
      </div>
    </main>

    <footer>
      <a href="../../index.html" class="back-link">← アプリ一覧に戻る</a>
    </footer>
  </div>

  <script src="app.js"></script>
<script src="../../theme.js"></script>
</body>
</html>
