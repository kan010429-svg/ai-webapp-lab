<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lorem — ダミーテキスト</title><script>(function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script><link rel="stylesheet" href="../../theme.css" /><link rel="stylesheet" href="../../app-ui.css" /><link rel="stylesheet" href="style.css"></head>
<body class="bt-themed bt-app"><div class="wb-page"><header class="wb-mast"><a class="wb-home" href="../../index.html">Apps</a><div class="wb-title-block"><span class="wb-kicker">TextTools</span><h1 class="wb-title">Lorem</h1></div><div class="theme-switch" role="group" aria-label="テーマ切替"><button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button><button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button></div></header><div class="wb-split"><section class="controls-col"><label class="wb-field"><span>Language</span><select id="langSelect"><option value="en">Latin</option><option value="ja">Japanese</option></select></label><label class="wb-field"><span>Unit</span><select id="typeSelect"><option value="paragraphs">Paragraphs</option><option value="sentences">Sentences</option><option value="words">Words</option></select></label><label class="wb-field"><span>Count</span><input type="number" id="countInput" min="1" max="50" value="3"></label><label class="check"><input type="checkbox" id="htmlWrapToggle">Wrap with p tags
