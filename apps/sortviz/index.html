<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SortViz — ソートアルゴリズム可視化</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <script>
  (function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../../theme.css" />
<link rel="stylesheet" href="style.css">
</head>
<body class="bt-themed bt-canvas-app">
  <div class="app">
    <header class="toolbar">
      <div class="toolbar-left">
        <a href="../../index.html" class="back-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <span class="app-title">📊 SortViz</span>
      
      <div class="theme-switch" role="group" aria-label="テーマ切替">
        <button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button>
        <button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button>
      </div>
    </div>
      <div class="toolbar-center">
        <div class="control-group">
          <label>アルゴリズム</label>
          <select id="algoSelect">
            <option value="bubble">バブルソート</option>
            <option value="selection">選択ソート</option>
            <option value="insertion">挿入ソート</option>
            <option value="merge">マージソート</option>
            <option value="quick">クイックソート</option>
            <option value="heap">ヒープソート</option>
            <option value="shell">シェルソート</option>
            <option value="radix">基数ソート</option>
          </select>
        </div>
        <div class="control-group">
          <label>要素数</label>
          <input type="range" id="sizeSlider" min="10" max="200" value="60" class="slider">
          <span id="sizeValue">60</span>
        </div>
        <div class="control-group">
          <label>速度</label>
          <input type="range" id="speedSlider" min="1" max="100" value="50" class="slider">
          <span id="speedValue">50</span>
        </div>
      </div>
      <div class="toolbar-right">
        <button class="btn" id="shuffleBtn">🔀 シャッフル</button>
        <button class="btn btn-primary" id="startBtn">▶ 開始</button>
      </div>
    </header>

    <main class="canvas-area">
      <canvas id="canvas"></canvas>
    </main>

    <footer class="info-bar">
      <div class="info-stats">
        <div class="stat"><span class="stat-label">比較</span><span class="stat-value" id="comparisons">0</span></div>
        <div class="stat"><span class="stat-label">交換</span><span class="stat-value" id="swaps">0</span></div>
        <div class="stat"><span class="stat-label">時間</span><span class="stat-value" id="elapsed">0ms</span></div>
      </div>
      <div class="algo-info" id="algoInfo">
        <span class="complexity" id="timeComplexity">O(n²)</span>
        <span class="complexity" id="spaceComplexity">O(1)</span>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
<script src="../../theme.js"></script>
</body>
</html>
