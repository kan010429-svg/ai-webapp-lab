<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Crypto Lab</title><script>(function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../../theme.css" />
<link rel="stylesheet" href="../../app-ui.css" />
<link rel="stylesheet" href="style.css"></head>
<body class="bt-themed bt-app bt-app-fill"><div class="wb-page wb-page-fill crypto-workbench"><header class="wb-toolbar"><div class="wb-toolbar-left"><a class="wb-home" href="../../index.html">Apps</a><h1>Crypto</h1></div><div class="wb-toolbar-right"><div class="theme-switch" role="group" aria-label="テーマ切替"><button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button><button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button></div></div></header><main class="workbench-main"><aside class="workbench-rail"><span class="wb-kicker">Security lab</span><p>Classical ciphers are for learning and demos. Password generation uses browser cryptographic random values.</p></aside><section class="workbench-stage"><div class="wb-tabs tabs" id="tabs"><button class="tab active" data-tab="cipher" type="button">Cipher</button><button class="tab" data-tab="hash" type="button">Hash</button><button class="tab" data-tab="password" type="button">Password</button><button class="tab" data-tab="steganography" type="button">Stego</button></div><div class="tab-content" id="tab-content"><div class="panel" id="panel-cipher"><div class="command-row"><label class="wb-field cipher-select"><span>Method</span><select id="cipher-type"><option value="caesar">Caesar</option><option value="vigenere">Vigenere</option><option value="rot13">ROT13</option><option value="atbash">Atbash</option><option value="base64">Base64</option></select></label><div class="wb-actions cipher-actions"><button id="btn-encrypt" class="wb-btn-key" type="button">Encrypt</button><button id="btn-decrypt" class="wb-btn" type="button">Decrypt</button></div></div><div class="key-row" id="key-row"><label class="wb-field"><span>Key</span><input type="text" id="cipher-key" value="3" placeholder="Shift or keyword"></label></div><div class="crypto-pair"><label class="wb-field"><span>Input</span><textarea id="cipher-input" placeholder="Enter text"></textarea></label><div class="transform-marker">to</div><label class="wb-field"><span>Output</span><textarea id="cipher-output" placeholder="Result" readonly></textarea></label></div></div><div class="panel hidden" id="panel-hash"><label class="wb-field"><span>Input</span><textarea id="hash-input" placeholder="Enter text to hash"></textarea></label><div class="hash-results" id="hash-results"></div></div><div class="panel hidden" id="panel-password"><div class="pw-gen wb-board"><label class="wb-field length-field"><span>Length <b id="pw-len-val">16</b></span><input type="range" id="pw-length" min="4" max="64" value="16"></label><label class="check"><input type="checkbox" id="pw-upper" checked> Uppercase</label><label class="check"><input type="checkbox" id="pw-lower" checked> Lowercase</label><label class="check"><input type="checkbox" id="pw-digits" checked> Digits</label><label class="check"><input type="checkbox" id="pw-symbols" checked> Symbols</label><button id="btn-gen-pw" class="wb-btn-key" type="button">Generate</button></div><div class="pw-output" id="pw-output"></div><div class="pw-strength" id="pw-strength"></div><label class="wb-field"><span>Password strength check</span><input type="text" id="pw-check" placeholder="Type a password to check strength"></label><div class="pw-meter" id="pw-meter"></div></div><div class="panel hidden" id="panel-steganography"><p class="hint-text">Hide text inside an image or extract hidden text from an image.</p><div class="wb-actions"><button id="btn-steg-upload" class="wb-btn-key" type="button">Choose image</button><button id="btn-steg-encode" class="wb-btn" type="button">Embed</button><button id="btn-steg-decode" class="wb-btn" type="button">Extract</button><button id="btn-steg-save" class="wb-btn-quiet" type="button">Save</button></div><label class="wb-field"><span>Payload</span><textarea id="steg-text" placeholder="Text to hide"></textarea></label><canvas id="steg-canvas"></canvas><div id="steg-result" class="steg-result"></div><input type="file" id="steg-file" accept="image/*" style="display:none"></div></div></section></main></div><script src="app.js"></script>
<script src="../../theme.js"></script></body></html>
