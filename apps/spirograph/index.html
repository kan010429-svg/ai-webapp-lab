<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spirograph - Browser Toys</title>
  <script>
  (function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../../theme.css" />
<link rel="stylesheet" href="style.css">
</head>
<body class="bt-themed bt-canvas-app">
  <div id="app">
    <header>
      <div class="bt-appbar"><div class="theme-switch" role="group" aria-label="テーマ切替">
        <button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button>
        <button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button>
      </div></div>

      <h1>🌀 Spirograph</h1>
      <div class="controls">
        <label>R <input type="range" id="R" min="20" max="200" value="120"></label>
        <label>r <input type="range" id="r" min="5" max="100" value="45"></label>
        <label>d <input type="range" id="d" min="5" max="150" value="80"></label>
        <label>速度 <input type="range" id="speed" min="1" max="50" value="10"></label>
        <select id="colorMode"><option value="rainbow">Rainbow</option><option value="gradient">Gradient</option><option value="mono">Mono</option><option value="neon">Neon</option></select>
        <button id="clearBtn">🗑️ クリア</button>
        <button id="saveBtn">💾 PNG</button>
      </div>
    </header>
    <canvas id="canvas"></canvas>
  </div>
  <script src="app.js"></script>
<script src="../../theme.js"></script>
</body>
</html>
