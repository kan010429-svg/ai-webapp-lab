<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life — ライフゲーム</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦠</text></svg>">
  <script>
  (function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../../theme.css" />
<link rel="stylesheet" href="../../app-ui.css" />
<link rel="stylesheet" href="style.css">
</head>
<body class="bt-themed bt-app bt-canvas-app">
  <div class="app">
    <header class="toolbar">
      <div class="toolbar-left">
        <a href="../../index.html" class="back-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <span class="app-title">🦠 Life</span>
      
      <div class="theme-switch" role="group" aria-label="テーマ切替">
        <button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button>
        <button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button>
      </div>
    </div>
      <div class="toolbar-center">
        <button class="btn btn-primary" id="playBtn">▶ 開始</button>
        <button class="btn" id="stepBtn">⏭ 1ステップ</button>
        <button class="btn" id="clearBtn">🗑 クリア</button>
        <button class="btn" id="randomBtn">🎲 ランダム</button>
        <div class="control-group">
          <label>速度</label>
          <input type="range" id="speedSlider" min="1" max="60" value="15" class="slider">
          <span id="speedValue">15</span>
        </div>
        <div class="control-group">
          <label>パターン</label>
          <select id="patternSelect">
            <option value="draw">自由描画</option>
            <option value="glider">グライダー</option>
            <option value="lwss">軽量宇宙船</option>
            <option value="pulsar">パルサー</option>
            <option value="gosper">ゴスパーグライダー銃</option>
            <option value="pentadecathlon">ペンタデカスロン</option>
            <option value="rpentomino">R-ペントミノ</option>
            <option value="acorn">エイコーン</option>
          </select>
        </div>
      </div>
      <div class="toolbar-right">
        <button class="btn" id="statsBtn">📊 Stats</button>
        <span class="stat">世代: <b id="genValue">0</b></span>
        <span class="stat">生存: <b id="popValue">0</b></span>
      </div>
    </header>

    <main class="canvas-area">
      <canvas id="canvas"></canvas>
    </main>
  </div>

  <div id="statsModal" class="modal">
    <div class="modal-content">
      <h2>📊 Statistics</h2>
      <div class="stat-item"><span class="stat-label">Max Generation:</span><span class="stat-value" id="statMaxGen">0</span></div>
      <div class="stat-item"><span class="stat-label">Max Population:</span><span class="stat-value" id="statMaxPop">0</span></div>
      <div class="stat-item"><span class="stat-label">Total Generations:</span><span class="stat-value" id="statTotalGens">0</span></div>
      <div class="stat-item"><span class="stat-label">Sessions:</span><span class="stat-value" id="statSessions">0</span></div>
      <button class="btn btn-primary" id="closeStats">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
<script src="../../theme.js"></script>
</body>
</html>
