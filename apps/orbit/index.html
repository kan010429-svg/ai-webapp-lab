<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbit Simulator - Browser Toys</title>
  <script>
  (function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../../theme.css" />
<link rel="stylesheet" href="style.css">
</head>
<body class="bt-themed bt-canvas-app">
  <div id="app">
    <header>
      <div class="bt-appbar"><div class="theme-switch" role="group" aria-label="テーマ切替">
        <button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button>
        <button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button>
      </div></div>

      <h1>🪐 Orbit Simulator</h1>
      <div class="controls">
        <select id="preset">
          <option value="solar">太陽系</option>
          <option value="binary">連星系</option>
          <option value="trojan">トロヤ群</option>
          <option value="figure8">8の字軌道</option>
        </select>
        <label>速度 <input type="range" id="speed" min="1" max="20" value="5"></label>
        <label>トレイル <input type="checkbox" id="trails" checked></label>
        <button id="resetBtn">🔄 リセット</button>
      </div>
    </header>
    <canvas id="canvas"></canvas>
    <div id="info"></div>
  </div>
  <script src="app.js"></script>
<script src="../../theme.js"></script>
</body>
</html>
