<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waveform — オーディオビジュアライザー</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="toolbar" id="toolbar">
      <div class="toolbar-left">
        <a href="../../index.html" class="back-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <span class="app-title">🌀 Waveform</span>
      </div>
      <div class="toolbar-center">
        <button class="btn btn-primary" id="micBtn">🎤 マイクON</button>
        <div class="control-group">
          <label>モード</label>
          <select id="vizMode">
            <option value="organic">有機体</option>
            <option value="geometry">幾何学</option>
            <option value="particles">パーティクル</option>
            <option value="ripple">波紋</option>
            <option value="aurora">オーロラ</option>
          </select>
        </div>
        <div class="control-group">
          <label>感度</label>
          <input type="range" id="sensitivity" min="1" max="10" value="5" class="slider">
        </div>
        <div class="control-group">
          <label>カラー</label>
          <select id="colorScheme">
            <option value="spectrum">スペクトラム</option>
            <option value="ocean">オーシャン</option>
            <option value="fire">ファイア</option>
            <option value="neon">ネオン</option>
            <option value="mono">モノクロ</option>
          </select>
        </div>
        <button class="btn" id="fullscreenBtn">⛶ 全画面</button>
      </div>
      <div class="toolbar-right">
        <div class="level-meter">
          <div class="level-bar" id="levelBar"></div>
        </div>
        <span class="stat" id="freqInfo">—</span>
      </div>
    </header>
    <main class="canvas-area" id="canvasArea">
      <canvas id="canvas"></canvas>
      <div class="start-overlay" id="startOverlay">
        <div class="start-content">
          <div class="start-icon">🌀</div>
          <div class="start-title">Waveform</div>
          <div class="start-sub">音に反応するビジュアライザー</div>
          <button class="btn btn-glow" id="startBtn">🎤 マイクを起動</button>
          <div class="start-hint">マイクへのアクセスを許可してください<br>音楽を流したり、声を出すと画面が反応します</div>
        </div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
