<!DOCTYPE html><html lang="ja" data-theme="cyber"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>⭐ Starfield - Browser Toys</title><script>
  (function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../../theme.css" />
<link rel="stylesheet" href="style.css"></head><body class="bt-themed bt-canvas-app"><div id="app"><header>
      <div class="bt-appbar"><div class="theme-switch" role="group" aria-label="テーマ切替">
        <button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button>
        <button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button>
      </div></div>
<h1>⭐ Starfield</h1><div class="controls"><label>速度 <input type="range" id="speed" min="1" max="50" value="15"></label><label>密度 <input type="range" id="density" min="100" max="2000" value="800"></label></div></header><canvas id="canvas"></canvas></div><script src="app.js"></script><script src="../../theme.js"></script>
</body></html>
