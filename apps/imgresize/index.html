<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>画像リサイズ・圧縮</title><link rel="icon" href="data:,"><script>(function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../../theme.css" />
<link rel="stylesheet" href="../../app-ui.css" />
<link rel="stylesheet" href="style.css"></head>
<body class="bt-themed bt-app"><div class="wb-page wb-page-wide img-workbench"><header class="wb-mast"><a class="wb-home" href="../../index.html">Apps</a><div class="wb-title-block"><span class="wb-kicker">Image tools</span><h1 class="wb-title">Image Resize</h1></div><div class="theme-switch" role="group" aria-label="テーマ切替"><button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button><button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button></div></header><p class="privacy-badge">Fully local processing. Images stay in this browser canvas.</p><section class="upload-area" id="uploadArea"><input type="file" id="fileInput" accept="image/*" multiple><div class="upload-text"><strong>Select images</strong><span>Click or drag and drop one or more image files</span></div></section><section class="settings-panel wb-well" id="settingsPanel" hidden><div class="settings-grid"><div class="field wb-field"><label for="widthInput">幅 (px)</label><input type="number" id="widthInput" min="1" placeholder="幅"></div><div class="field wb-field"><label for="heightInput">高さ (px)</label><input type="number" id="heightInput" min="1" placeholder="高さ"></div><div class="field checkbox-field"><label><input type="checkbox" id="aspectLock" checked> アスペクト比を維持</label></div></div><div class="quick-scale"><span class="quick-label wb-label">Scale</span><button class="scale-btn" data-scale="1" type="button">100%</button><button class="scale-btn" data-scale="0.75" type="button">75%</button><button class="scale-btn" data-scale="0.5" type="button">50%</button><button class="scale-btn" data-scale="0.25" type="button">25%</button></div><div class="settings-grid"><div class="field wb-field"><label for="formatSelect">出力形式</label><select id="formatSelect"><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option><option value="image/png">PNG</option></select></div><div class="field wb-field"><label for="qualitySlider">品質: <span id="qualityValue">85</span></label><input type="range" id="qualitySlider" min="1" max="100" value="85"></div></div><div class="actions wb-actions"><button id="applyAllBtn" class="primary-btn wb-btn-key" type="button">Apply all</button><button id="downloadAllBtn" class="download-btn wb-btn" type="button">Download all</button><button id="clearAllBtn" class="ghost-btn wb-btn-quiet" type="button">Clear all</button></div></section><div class="file-list" id="fileList"></div></div><template id="fileCardTemplate"><div class="file-card"><div class="preview-row"><div class="preview-col"><div class="preview-label">元画像</div><canvas class="src-canvas"></canvas><div class="meta original-meta"></div></div><div class="preview-col"><div class="preview-label">変換後</div><canvas class="out-canvas"></canvas><div class="meta result-meta">未処理</div></div></div><div class="card-footer"><div class="ratio-badge" hidden></div><div class="card-actions"><button class="card-download-btn" disabled>Download</button><button class="card-remove-btn">Remove</button></div></div></div></template><script src="app.js"></script>
<script src="../../theme.js"></script></body></html>
