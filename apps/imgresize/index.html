<!DOCTYPE html>
<html lang="ja" data-theme="cyber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像リサイズ・圧縮</title>
  <link rel="icon" href="data:,">
  <script>
  (function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../../theme.css" />
<link rel="stylesheet" href="style.css">
</head>
<body class="bt-themed">
  <div class="container">
    <header class="page-header">
      <div class="bt-appbar">
      <a class="bt-back" href="../../index.html">← 一覧へ戻る</a>
      <div class="theme-switch" role="group" aria-label="テーマ切替">
        <button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button>
        <button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button>
      </div>
    </div>

      <h1>🖼️ 画像リサイズ・圧縮</h1>
      <p class="subtitle">画像はブラウザ内(Canvas)だけで処理されます。サーバーへのアップロードは一切行われません。</p>
    </header>

    <div class="privacy-badge">🔒 完全ローカル処理 — 画像は外部に送信されません</div>

    <div class="upload-area" id="uploadArea">
      <input type="file" id="fileInput" accept="image/*" multiple>
      <div class="upload-text">
        <div class="upload-icon">📁</div>
        <div>クリックまたはドラッグ&ドロップで画像を選択(複数可)</div>
      </div>
    </div>

    <div class="settings-panel" id="settingsPanel" hidden>
      <div class="settings-grid">
        <div class="field">
          <label for="widthInput">幅 (px)</label>
          <input type="number" id="widthInput" min="1" placeholder="幅">
        </div>
        <div class="field">
          <label for="heightInput">高さ (px)</label>
          <input type="number" id="heightInput" min="1" placeholder="高さ">
        </div>
        <div class="field checkbox-field">
          <label><input type="checkbox" id="aspectLock" checked> アスペクト比を維持</label>
        </div>
      </div>

      <div class="quick-scale">
        <span class="quick-label">比率指定:</span>
        <button class="scale-btn" data-scale="1">100%</button>
        <button class="scale-btn" data-scale="0.75">75%</button>
        <button class="scale-btn" data-scale="0.5">50%</button>
        <button class="scale-btn" data-scale="0.25">25%</button>
      </div>

      <div class="settings-grid">
        <div class="field">
          <label for="formatSelect">出力形式</label>
          <select id="formatSelect">
            <option value="image/jpeg">JPEG</option>
            <option value="image/webp">WebP</option>
            <option value="image/png">PNG</option>
          </select>
        </div>
        <div class="field">
          <label for="qualitySlider">品質: <span id="qualityValue">85</span></label>
          <input type="range" id="qualitySlider" min="1" max="100" value="85">
        </div>
      </div>

      <div class="actions">
        <button id="applyAllBtn" class="primary-btn">⚙️ 全画像に適用</button>
        <button id="downloadAllBtn" class="download-btn">💾 すべてダウンロード</button>
        <button id="clearAllBtn" class="ghost-btn">🗑️ すべてクリア</button>
      </div>
    </div>

    <div class="file-list" id="fileList"></div>
  </div>

  <template id="fileCardTemplate">
    <div class="file-card">
      <div class="preview-row">
        <div class="preview-col">
          <div class="preview-label">元画像</div>
          <canvas class="src-canvas"></canvas>
          <div class="meta original-meta"></div>
        </div>
        <div class="preview-col">
          <div class="preview-label">変換後</div>
          <canvas class="out-canvas"></canvas>
          <div class="meta result-meta">未処理</div>
        </div>
      </div>
      <div class="card-footer">
        <div class="ratio-badge" hidden></div>
        <div class="card-actions">
          <button class="card-download-btn" disabled>💾 ダウンロード</button>
          <button class="card-remove-btn">✕ 削除</button>
        </div>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
<script src="../../theme.js"></script>
</body>
</html>
