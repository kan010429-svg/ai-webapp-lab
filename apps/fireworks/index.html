<!DOCTYPE html><html lang="ja" data-theme="cyber"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Fireworks</title><script>
  (function(){try{var t=localStorage.getItem('bt-theme');if(t==='cyber'||t==='lab')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="../../theme.css" />
<link rel="stylesheet" href="../../app-ui.css" />
<link rel="stylesheet" href="style.css"></head><body class="bt-themed bt-app bt-canvas-app"><div id="app"><header>
      <div class="bt-appbar"><div class="theme-switch" role="group" aria-label="テーマ切替">
        <button type="button" data-theme-toggle="cyber" aria-pressed="true">Cyber</button>
        <button type="button" data-theme-toggle="lab" aria-pressed="false">Lab</button>
      </div></div>
<h1>🎆 Fireworks</h1><div class="controls"><button id="autoBtn">Auto: ON</button><button id="statsBtn">📊 Stats</button></div></header><canvas id="c"></canvas></div><div id="statsModal" class="modal"><div class="modal-content"><h2>📊 Statistics</h2><div class="stat-item"><span class="stat-label">Total Launched:</span><span class="stat-value" id="statTotalLaunched">0</span></div><div class="stat-item"><span class="stat-label">Max Sparks:</span><span class="stat-value" id="statMaxSparks">0</span></div><div class="stat-item"><span class="stat-label">Sessions:</span><span class="stat-value" id="statSessions">0</span></div><button id="closeStats">Close</button></div></div><script src="app.js"></script><script src="../../theme.js"></script>
</body></html>
