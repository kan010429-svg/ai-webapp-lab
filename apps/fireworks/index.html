<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Fireworks</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><h1>🎆 Fireworks</h1><div class="controls"><button id="autoBtn">Auto: ON</button><button id="statsBtn">📊 Stats</button></div></header><canvas id="c"></canvas></div><div id="statsModal" class="modal"><div class="modal-content"><h2>📊 Statistics</h2><div class="stat-item"><span class="stat-label">Total Launched:</span><span class="stat-value" id="statTotalLaunched">0</span></div><div class="stat-item"><span class="stat-label">Max Sparks:</span><span class="stat-value" id="statMaxSparks">0</span></div><div class="stat-item"><span class="stat-label">Sessions:</span><span class="stat-value" id="statSessions">0</span></div><button id="closeStats">Close</button></div></div><script src="app.js"></script></body></html>
